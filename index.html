<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12333a">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Дежурства — Kujdestaritë</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Kujdestarit%C3%AB%22%2C%22short_name%22%3A%22Dezurstva%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23eef1f2%22%2C%22theme_color%22%3A%22%2312333a%22%7D">
<style>
:root{
  --paper:#EDF0F1; --surface:#FFFFFF; --surface2:#F5F8F8; --surface3:#E9EFF0;
  --ink:#0F2027; --muted:#57696F; --faint:#8698A0;
  --line:#D7E0E3; --line2:#B9C8CD;
  --teal:#0E5C58; --teal2:#DCEDEA;
  --amber:#8A5708; --amber2:#F7EBD5;
  --rose:#A32B3A; --rose2:#F9E2E4;
  --violet:#4A3B7A; --violet2:#E8E4F3;
  --r:10px; --rl:14px;
  --fs:15px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0C1417; --surface:#141E21; --surface2:#19252A; --surface3:#1F2E33;
  --ink:#E4ECEE; --muted:#9AACB3; --faint:#6E838B;
  --line:#243338; --line2:#37494F;
  --teal:#57C6B8; --teal2:#0F3A37;
  --amber:#E0AC5A; --amber2:#382A12;
  --rose:#EB8794; --rose2:#3B1A20;
  --violet:#A99AD9; --violet2:#241F3B;
}}
:root[data-theme="dark"]{
  --paper:#0C1417; --surface:#141E21; --surface2:#19252A; --surface3:#1F2E33;
  --ink:#E4ECEE; --muted:#9AACB3; --faint:#6E838B;
  --line:#243338; --line2:#37494F;
  --teal:#57C6B8; --teal2:#0F3A37;
  --amber:#E0AC5A; --amber2:#382A12;
  --rose:#EB8794; --rose2:#3B1A20;
  --violet:#A99AD9; --violet2:#241F3B;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--paper);color:var(--ink);
  font:var(--fs)/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
.hide{display:none!important}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:8px 12px}
.bar1{display:flex;align-items:center;gap:8px}
.logo{font-weight:700;letter-spacing:-.01em;font-size:15px;white-space:nowrap}
.logo small{display:block;font-weight:400;font-size:11px;color:var(--faint);letter-spacing:0}
.grow{flex:1}
.icobtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);display:grid;place-items:center;font-size:13px;background:var(--surface)}
.icobtn:active{background:var(--surface2)}
.icobtn.on{background:var(--teal);border-color:var(--teal);color:#fff}
.mrow{display:flex;align-items:center;gap:6px;margin-top:8px}
.mtitle{flex:1;font-size:21px;font-weight:650;letter-spacing:-.02em;text-align:center}
.mtitle b{font-weight:650}
.mtitle span{color:var(--faint);font-weight:400}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;border:1px solid transparent}
.tabs button[aria-selected="true"]{background:var(--surface3);color:var(--ink);border-color:var(--line)}
main{max-width:1100px;margin:0 auto;padding:12px 12px 90px}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);margin-bottom:12px;overflow:hidden}
.card>h2{margin:0;padding:11px 13px 2px;font-size:13.5px;font-weight:650}
.card>p.h{margin:0;padding:0 13px 10px;font-size:12.5px;color:var(--muted)}
.pad{padding:11px 13px}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:var(--r);padding:9px 13px;font-size:13.5px;font-weight:500}
.btn:active{background:var(--surface2)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.pri{color:#08181A}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#08181A}}
.btn.gh{border-color:transparent;color:var(--muted)}
.btn.dg{color:var(--rose);border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--surface3);color:var(--muted);white-space:nowrap}
.chip.t{background:var(--teal2);color:var(--teal)}
.chip.a{background:var(--amber2);color:var(--amber)}
.chip.r{background:var(--rose2);color:var(--rose)}
.chip.v{background:var(--violet2);color:var(--violet)}
.note{border-radius:var(--r);padding:9px 11px;font-size:13px;margin-bottom:10px}
.note.ok{background:var(--teal2);color:var(--teal)}
.note.warn{background:var(--amber2);color:var(--amber)}
.note.bad{background:var(--rose2);color:var(--rose)}
.empty{padding:26px 14px;text-align:center;color:var(--faint);font-size:13.5px}
label.f{display:block;font-size:11.5px;color:var(--muted);margin:9px 0 3px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;border:1px solid var(--line2);background:var(--surface2);border-radius:9px;padding:8px 10px}
textarea{resize:vertical;min-height:70px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* ---------- kuota në grafik ---------- */
.qb{font-size:10px;padding:1px 5px;border-radius:20px;background:var(--surface3);color:var(--faint);
  margin-left:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.qb.full{background:var(--amber2);color:var(--amber);font-weight:650}
.qb.low{background:var(--rose2);color:var(--rose);font-weight:650}
.qb.ok{background:var(--teal2);color:var(--teal)}

/* ---------- dritarja e gjenerimit ---------- */
.pfl{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.pfl:last-child{border-bottom:0}
.pfl b{flex:1;font-size:13px;font-weight:600}
.pfl span{font-size:11.5px;color:var(--muted)}
.vr{border:1px solid var(--line2);border-radius:11px;padding:10px 12px;margin-bottom:8px}
.vr.best{border-color:var(--teal);background:var(--teal2)}
.vr .h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.vr .h b{flex:1;font-size:13.5px;font-weight:650}
.vr .m{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--muted)}
.vr .m i{font-style:normal;color:var(--ink);font-weight:600}

/* ---------- roster ---------- */
.rt{width:100%;border-collapse:collapse;font-size:13px}
.rt th{background:var(--surface2);font-size:11px;color:var(--muted);font-weight:600;padding:7px 8px;text-align:left;border-bottom:1px solid var(--line)}
.rt td{border-bottom:1px solid var(--line);padding:0}
.rt tr:last-child td{border-bottom:0}
.rt .dcell{padding:6px 8px;width:70px;white-space:nowrap}
.rt .dnum{font-weight:650;font-size:15px}
.rt .dow{font-size:10.5px;color:var(--faint)}
.rt tr.we{background:var(--surface2)}
.rt tr.we .dnum{color:var(--amber)}
.rt tr.hol{background:var(--rose2)}
.rt tr.hol .dnum{color:var(--rose)}
.pick{display:block;width:100%;text-align:left;padding:7px 9px;min-height:36px;font-size:13px;border-radius:6px}
.pick:active{background:var(--surface3)}
.pick.none{color:var(--rose);font-weight:500}
.pick.lk{box-shadow:inset 2px 0 0 var(--teal)}
.pick.amb{opacity:.45}
.holtag{font-size:10px;color:var(--rose);display:block}

/* lista për telefon */
.dl{border-bottom:1px solid var(--line);padding:8px 11px}
.dl:last-child{border-bottom:0}
.dl.we{background:var(--surface2)}
.dl.hol{background:var(--rose2)}
.dl .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.dl .hd b{font-size:16px}
.dl .hd span{font-size:11.5px;color:var(--faint)}
.dl .rw{display:flex;align-items:center;gap:8px;padding:3px 0}
.dl .rw i{font-style:normal;font-size:10px;width:16px;height:16px;border-radius:5px;display:grid;place-items:center;background:var(--surface3);color:var(--muted);flex:none}
.dl .rw button{flex:1;text-align:left;font-size:13.5px;padding:3px 5px;border-radius:6px}
.dl .rw button.none{color:var(--rose)}

/* ---------- calendar grid ---------- */
.cal{padding:7px;overflow-x:auto}
.calhead,.calbody{display:grid;grid-template-columns:repeat(7,minmax(46px,1fr));gap:3px;min-width:340px}
.calhead div{text-align:center;font-size:10px;color:var(--faint);padding:3px 0}
.cc{border:1px solid var(--line);border-radius:8px;padding:3px;min-height:74px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.cc.pad{border-color:transparent;background:transparent;min-height:0}
.cc.we{background:var(--surface2)}
.cc.hol{background:var(--rose2);border-color:var(--rose2)}
.cc .n{font-size:11px;font-weight:650;color:var(--muted);line-height:1.1}
.cc.we .n{color:var(--amber)}
.cc.hol .n{color:var(--rose)}
.cc .n em{display:block;font-style:normal;font-size:8.5px;font-weight:400;color:var(--rose);overflow:hidden;white-space:nowrap}
.cc .cn{display:flex;align-items:center;gap:3px;width:100%;text-align:left;font-size:9.5px;line-height:1.2;
  padding:2px 3px;border-radius:5px;background:var(--surface2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cc.we .cn,.cc.hol .cn{background:var(--surface)}
.cc .cn:active{background:var(--surface3)}
.cc .cn i{font-style:normal;font-size:8px;color:var(--faint);flex:none}
.cc .cn.no{color:var(--rose)}
.cc .cn.lk{box-shadow:inset 2px 0 0 var(--teal)}
@media(min-width:680px){
  .calhead,.calbody{grid-template-columns:repeat(7,1fr)}
  .cc{min-height:92px} .cc .cn{font-size:11px} .cc .n{font-size:13px}
}

/* ---------- requests ---------- */
.rq{display:flex;gap:9px;align-items:flex-start;padding:9px 13px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.rq:last-child{border-bottom:0}
.rq:active{background:var(--surface2)}
.rq .dt{flex:none;width:96px}
.rq .dt b{display:block;font-size:12.5px;font-weight:650;color:var(--rose)}
.rq .dt span{font-size:10px;color:var(--faint)}
.rq .bd{flex:1;min-width:0}
.rq .bd b{display:block;font-size:13.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rq .bd span{font-size:11.5px;color:var(--muted)}

/* ---------- doctors ---------- */
.dr{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.dr:last-child{border-bottom:0}
.dr:active{background:var(--surface2)}
.dr .av{width:30px;height:30px;border-radius:9px;background:var(--surface3);display:grid;place-items:center;font-size:11px;font-weight:650;color:var(--muted);flex:none}
.dr .nm{flex:1;min-width:0}
.dr .nm b{display:block;font-weight:550;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr .nm span{font-size:11px;color:var(--faint)}
.dr.off{opacity:.42}
.ybal{flex:none;text-align:right;min-width:52px;padding-left:6px;border-left:1px solid var(--line)}
.ybal b{display:block;font-size:15px;font-weight:650;line-height:1.1}
.ybal span{display:block;font-size:10px;color:var(--faint)}
.bhdr{padding:9px 13px 5px;font-size:11.5px;color:var(--muted);background:var(--surface2);border-bottom:1px solid var(--line);font-weight:600}

/* ---------- preferencat në masë ---------- */
.pf{padding:9px 12px;border-bottom:1px solid var(--line)}
.pf:last-child{border-bottom:0}
.pf .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pf .top b{flex:1;font-size:13.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf .top .q{font-size:11px;color:var(--faint);white-space:nowrap}
.pf .wds{display:flex;gap:4px;margin-bottom:6px}
.pf .wds button{flex:1;border:1px solid var(--line2);border-radius:7px;padding:5px 0;font-size:11px;background:var(--surface)}
.pf .wds button.off{background:var(--rose2);border-color:var(--rose);color:var(--rose);font-weight:650}
.pf .wds button.we{background:var(--surface3)}
.pf .wds button.we.off{background:var(--rose2)}
.pf .tri{display:flex;gap:5px}
.pf .tri button{flex:1;border:1px solid var(--line2);border-radius:7px;padding:5px 4px;font-size:11px;background:var(--surface);
  display:flex;align-items:center;justify-content:center;gap:4px}
.pf .tri button i{font-style:normal;width:7px;height:7px;border-radius:50%;background:var(--teal);flex:none}
.pf .tri button.avoid{background:var(--amber2);border-color:var(--amber);color:var(--amber)}
.pf .tri button.avoid i{background:var(--amber)}
.pf .tri button.never{background:var(--rose2);border-color:var(--rose);color:var(--rose);font-weight:600}
.pf .tri button.never i{background:var(--rose)}
.pflegend{display:flex;gap:12px;padding:8px 12px 0;font-size:11px;color:var(--muted);flex-wrap:wrap}
.pflegend span i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* ---------- stats ---------- */
.st{padding:8px 13px;border-bottom:1px solid var(--line)}
.st:last-child{border-bottom:0}
.st .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.st .t b{font-weight:550;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .t span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.bar{height:5px;background:var(--surface3);border-radius:3px;margin-top:5px;display:flex;overflow:hidden}
.bar i{display:block;background:var(--teal)}
.bar i.w{background:var(--amber)}
.fc{width:100%;border-collapse:collapse;font-size:12.5px}
.fc th,.fc td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.fc th{font-size:11px;color:var(--muted);font-weight:600}
.fc td.bad{color:var(--rose);font-weight:600}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,16,20,.5);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-radius:18px 18px 0 0;max-height:90vh;display:none;flex-direction:column;border-top:1px solid var(--line)}
.sheet.on{display:flex}
@media(min-width:680px){.sheet{left:50%;transform:translateX(-50%);width:560px;border-radius:16px;bottom:24px;max-height:84vh}}
.sheet>header{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet>header h3{margin:0;flex:1;font-size:15px;font-weight:650}
.sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 0 12px}
.sheet .body.p{padding:12px 14px}
.sheet .foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.sheet .foot .btn{flex:1;text-align:center}
.pk{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 14px;border-bottom:1px solid var(--line)}
.pk:active{background:var(--surface2)}
.pk .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.pk.sel{background:var(--teal2)}
.pk.no{opacity:.5}
.pk.no .nm{text-decoration:line-through}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:10px 14px}
.days button{border:1px solid var(--line2);border-radius:8px;padding:7px 0;font-size:12.5px;background:var(--surface)}
.days button.on{background:var(--rose2);border-color:var(--rose);color:var(--rose);font-weight:650}
.days button.we{background:var(--surface3)}
.days button.on.we{background:var(--rose2)}
.wd{display:flex;gap:5px;flex-wrap:wrap}
.wd button{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12px;background:var(--surface)}
.wd button.on{background:var(--rose2);border-color:var(--rose);color:var(--rose);font-weight:600}
.seg{display:flex;gap:0;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{flex:1;padding:7px 4px;font-size:12px;background:var(--surface);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--teal);color:#fff;font-weight:600}
:root[data-theme="dark"] .seg button.on{color:#08181A}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw label{font-size:13.5px}
.sw label small{display:block;color:var(--faint);font-size:11.5px}
.tg{width:44px;height:25px;border-radius:20px;background:var(--line2);position:relative;flex:none;transition:background .15s}
.tg::after{content:"";position:absolute;top:2.5px;left:2.5px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.tg.on{background:var(--teal)}
.tg.on::after{transform:translateX(19px)}

/* ---------- toast ---------- */
#toasts{position:fixed;left:0;right:0;bottom:14px;z-index:80;display:flex;flex-direction:column;
  align-items:center;gap:7px;pointer-events:none;padding:0 12px}
.toast{background:var(--ink);color:var(--paper);border-radius:11px;padding:10px 14px;font-size:13px;
  max-width:520px;box-shadow:0 6px 22px rgba(0,0,0,.28);pointer-events:auto;line-height:1.35}
.toast.bad{background:var(--rose);color:#fff}
.toast.warn{background:var(--amber);color:#fff}
.toast.ok{background:var(--teal);color:#fff}
.toast b{display:block;font-weight:650;margin-bottom:2px}

/* ---------- confirm ---------- */
.cfm{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(6,16,20,.55)}
.cfm.on{display:flex}
.cfm .box{background:var(--surface);border-radius:16px;max-width:420px;width:100%;overflow:hidden;border:1px solid var(--line)}
.cfm h3{margin:0;padding:15px 16px 4px;font-size:16px;font-weight:650}
.cfm p{margin:0;padding:0 16px 8px;font-size:13.5px;color:var(--muted)}
.cfm ul{margin:0 0 10px;padding:0 16px 0 32px;font-size:13px;color:var(--ink)}
.cfm ul li{margin:3px 0}
.cfm .btns{display:flex;gap:8px;padding:12px 16px 15px}
.cfm .btns .btn{flex:1;text-align:center}

/* ---------- drag ---------- */
.drag-src{opacity:.35}
.drag-ok{box-shadow:inset 0 0 0 2px var(--teal);border-radius:6px}
.drag-no{box-shadow:inset 0 0 0 2px var(--rose);border-radius:6px}
#ghost{position:fixed;z-index:100;pointer-events:none;background:var(--teal);color:#fff;
  padding:5px 10px;border-radius:9px;font-size:12.5px;font-weight:600;box-shadow:0 5px 16px rgba(0,0,0,.3);
  transform:translate(-50%,-140%);white-space:nowrap;display:none}
.pick,.cn{touch-action:pan-y}

/* ---------- chips picker ---------- */
.cp{display:flex;flex-wrap:wrap;gap:5px}
.cp button{border:1px solid var(--line2);border-radius:20px;padding:5px 10px;font-size:12px;background:var(--surface)}
.cp button.on{background:var(--teal2);border-color:var(--teal);color:var(--teal);font-weight:600}

/* ---------- report tables ---------- */
.rep{width:100%;border-collapse:collapse;font-size:12.5px}
.rep th,.rep td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.rep th{font-size:10.5px;color:var(--muted);font-weight:600;background:var(--surface2);position:sticky;top:0}
.rep td.n{text-align:right;font-variant-numeric:tabular-nums}
.rep tr.tot td{font-weight:650;background:var(--surface2)}
.scrollx{overflow-x:auto}

/* ---------- ruajtja: IndexedDB, me localStorage si rrugë dytësore ---------- */
var DBN='kujdestari', DBV=1, _db=null, _fallback=false;

var MEM={};
function lsKey(k){ return 'kuj:'+k; }
function fbGet(k){ try{ var v=localStorage.getItem(lsKey(k)); return Promise.resolve(v==null?undefined:JSON.parse(v)); }
  catch(e){ return Promise.resolve(MEM[k]); } }
function fbSet(k,v){ try{ localStorage.setItem(lsKey(k),JSON.stringify(v)); }catch(e){ MEM[k]=v; } return Promise.resolve(true); }
function fbDel(k){ try{ localStorage.removeItem(lsKey(k)); }catch(e){} delete MEM[k]; return Promise.resolve(true); }
function fbKeys(){
  var out=[];
  try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i);
        if(k && k.indexOf('kuj:')===0) out.push(k.slice(4)); } }catch(e){ out=Object.keys(MEM); }
  return Promise.resolve(out);
}

function open(){
  return new Promise(function(res,rej){
    if(_db) return res(_db);
    if(_fallback) return rej(new Error('fallback'));
    if(typeof indexedDB==='undefined' || !indexedDB){ _fallback=true; return rej(new Error('no-idb')); }
    var rq;
    try{ rq=indexedDB.open(DBN,DBV); }catch(e){ _fallback=true; return rej(e); }
    rq.onupgradeneeded=function(){ var d=rq.result; if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); };
    rq.onsuccess=function(){ _db=rq.result; res(_db); };
    rq.onerror=function(){ _fallback=true; rej(rq.error); };
    rq.onblocked=function(){ _fallback=true; rej(new Error('blocked')); };
  });
}
function get(k){ return open().then(function(d){ return new Promise(function(res,rej){
  var r=d.transaction('kv','readonly').objectStore('kv').get(k);
  r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }); })
  .catch(function(){ return fbGet(k); }); }
function set(k,v){ return open().then(function(d){ return new Promise(function(res,rej){
  var t=d.transaction('kv','readwrite'); t.objectStore('kv').put(v,k);
  t.oncomplete=function(){res(true);}; t.onerror=function(){rej(t.error);}; }); })
  .catch(function(){ return fbSet(k,v); }); }
function del(k){ return open().then(function(d){ return new Promise(function(res){
  var t=d.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete=function(){res(true);}; }); })
  .catch(function(){ return fbDel(k); }); }
function keys(){ return open().then(function(d){ return new Promise(function(res){
  var r=d.transaction('kv','readonly').objectStore('kv').getAllKeys();
  r.onsuccess=function(){res(r.result||[]);}; }); })
  .catch(function(){ return fbKeys(); }); }
function usingFallback(){ return _fallback; }

/* ---------- ndihmëse ---------- */
function $(s,r){ return (r||document).querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function uid(){ return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function pad(n){ return String(n).padStart(2,'0'); }
function mk(y,m){ return y+'-'+pad(m); }
function fmtShort(isoS){ var p=isoS.split('-'); return (+p[2])+'.'+(+p[1])+'.'+p[0].slice(2); }
function initials(name){
  var p=String(name).trim().split(/\s+/);
  return (p[0]||'').charAt(0)+((p[1]||'').charAt(0)||'');
}
function tpl(s,o){ return String(s).replace(/\{(\w+)\}/g,function(_,k){ return o[k]==null?'':o[k]; }); }

return { T:T, get:get, set:set, del:del, keys:keys, usingFallback:usingFallback, $:$, esc:esc, uid:uid, pad:pad,
         mk:mk, fmtShort:fmtShort, initials:initials, tpl:tpl };
})();

/* ============================================================
   REGJISTRI FILLESTAR
   Bosh me qëllim: fajlli i programit nuk mban asnjë të dhënë personale,
   që të mund të vendoset në një depo publike pa rrezik.

/* ============================================================
   FESTAT — Ligji për praznicite i RM (Sl. vesnik 21/98, 18/07)
   Të llogaritshmet dalin vetë. Bajrami kërkon konfirmim vjetor.
   ============================================================ */
(function(){ 'use strict';

function iso(y,m,d){ return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function addDays(isoStr,n){
  var p=isoStr.split('-').map(Number);
  var dt=new Date(Date.UTC(p[0],p[1]-1,p[2]+n));
  return iso(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate());
}
function dow(isoStr){ // 0=e hënë … 6=e diel
  var p=isoStr.split('-').map(Number);
  return (new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay()+6)%7;
}

/* Pashkët ortodokse — Meeus, kalendari julian, i kthyer në gregorian */
function orthodoxEaster(y){
  var a=y%4, b=y%7, c=y%19, d=(19*c+15)%30, e=(2*a+4*b-d+34)%7;
  var month=Math.floor((d+e+114)/31), day=((d+e+114)%31)+1;
  var jul=new Date(Date.UTC(y,month-1,day));
  var shift=13; // ndryshimi julian↔gregorian për shek. XX–XXI
  jul.setUTCDate(jul.getUTCDate()+shift);
  return iso(jul.getUTCFullYear(),jul.getUTCMonth()+1,jul.getUTCDate());
}
/* Pashkët katolike — Meeus/Jones/Butcher */
function catholicEaster(y){
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
      f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
      h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,
      l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
      mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return iso(y,mo,da);
}

/* scope: 'all' për të gjithë | 'ort' | 'isl' | 'kat'  */

  add(addDays(oe,-2),'E premtja e Madhe','Велики петок','ort');

  var extra=[];

/* ============================================================
   MOTORI — ambulanta specialistike + tri radhët e kujdestarisë
   ============================================================ */
(function(){ 'use strict';
var H = window.LB_HOL;
var iso=H.iso, addDays=H.addDays, dow=H.dow;

function daysInMonth(y,m){ return new Date(Date.UTC(y,m,0)).getUTCDate(); }

function monthDays(y,m,holidays){
  var n=daysInMonth(y,m), out=[], hmap={};
  (holidays||[]).forEach(function(h){ (hmap[h.date]=hmap[h.date]||[]).push(h); });
  for(var d=1;d<=n;d++){
    var dt=iso(y,m,d), w=dow(dt), hs=hmap[dt]||[];
    out.push({
      d:d, date:dt, w:w,
      weekend:w>=5,
      hol:hs,
      holAll:hs.some(function(x){return x.scope==='all';}),
      holRel:hs.filter(function(x){return x.scope!=='all';})
    });
  }
  return out;
}

/* mbulon data një dritare turnusi? */
function inTurnus(doc,date){
  if(!doc.turnusFrom && !doc.turnusTo) return true;
  if(doc.turnusFrom && date < doc.turnusFrom) return false;
  if(doc.turnusTo   && date > doc.turnusTo)   return false;
  return true;
}
function isAbsent(doc,date){
  var a=doc.absences||[];
  for(var i=0;i<a.length;i++){
    var x=a[i];
    if(typeof x==='string'){ if(x===date) return true; }
    else if(x && x.from && date>=x.from && date<=(x.to||x.from)) return true;
  }
  return false;
}

/* a e prek një festë fetare të tijën? */
function relHits(doc,day){
  if(!day.holRel.length) return false;
  return day.holRel.some(function(h){ return h.scope===doc.religion; });
}

/* ---------- rand me farë, që rigjenerimi të jetë i përsëritshëm ---------- */
function rng(seed){
  var s=seed>>>0 || 1;
  return function(){ s^=s<<13; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; };
}

/* ============================================================
   AMBULANTA — blloqe mbi ditët e punës
   ============================================================ */
function splitBlocks(days, count){
  var work = days.filter(function(x){ return !x.weekend && !x.holAll; });
  if(!work.length) return [];
  count = Math.max(1, count||2);
  var per = Math.ceil(work.length/count), blocks=[], i=0;
  while(i<work.length){
    var chunk = work.slice(i, i+per);
    blocks.push({from:chunk[0].date, to:chunk[chunk.length-1].date, days:chunk.map(function(x){return x.date;})});
    i += per;
  }
  return blocks;
}

function generateAmb(o){
  var days = monthDays(o.year,o.month,o.holidays);
  var blocks = splitBlocks(days, o.blocksPerMonth||2);
  var hist = o.history||{};
  var pool = (o.doctors||[]).filter(function(d){ return d.active!==false && d.doesAmb; });
  var r = rng(o.seed||12345);
  var used = {}, issues=[];

  blocks.forEach(function(b){
    if(o.lockedAmb && o.lockedAmb[b.from]){ b.doctorId=o.lockedAmb[b.from]; used[b.doctorId]=1; return; }
    var cands = pool.filter(function(d){
      if(used[d.id]) return false;
      return !b.days.some(function(dt){ return isAbsent(d,dt) || !inTurnus(d,dt); });
    });
    if(!cands.length){ issues.push({type:'amb-empty', from:b.from, to:b.to}); return; }
    cands.sort(function(a,c){
      // rendi i vendosur me dorë ka përparësi
      var oa=(a.ambOrder==null?null:a.ambOrder), oc=(c.ambOrder==null?null:c.ambOrder);
      if(oa!=null && oc!=null && oa!==oc) return oa-oc;
      if(oa!=null && oc==null) return -1;
      if(oa==null && oc!=null) return 1;
      var ha=(hist[a.id]&&hist[a.id].amb)||0, hc=(hist[c.id]&&hist[c.id].amb)||0;
      if(ha!==hc) return ha-hc;
      var la=(hist[a.id]&&hist[a.id].lastAmb)||'', lc=(hist[c.id]&&hist[c.id].lastAmb)||'';
      if(la!==lc) return la<lc?-1:1;
      return r()-0.5;
    });
    b.doctorId = cands[0].id;
    used[b.doctorId]=1;
  });
  return {blocks:blocks, issues:issues};
}

/* ============================================================
   KUJDESTARIA — tri radhët
   ============================================================ */
/* filtër i fortë: a mund ta marrë fare këtë ditë */
function buildCand(doc, day, ambBusy){
  if(doc.active===false || !doc.doesDuty) return false;
  if(!inTurnus(doc, day.date)) return false;
  if(isAbsent(doc, day.date)) return false;
  if((doc.skipWeekdays||[]).indexOf(day.w)>=0) return false;
  if(ambBusy[doc.id] && ambBusy[doc.id][day.date]) return false;
  if(day.weekend && doc.wantsWeekend==='never') return false;
  if(day.holAll && doc.wantsStateHoliday==='never') return false;
  if(relHits(doc,day) && doc.wantsRelHoliday==='never') return false;
  return true;
}

/* ---------- funksioni i drejtësisë ----------
   Çdo term është devijim në katror, që të dënohen skajet, jo mesatarja.
   Kush punon më shumë mban përpjesëtimisht më shumë fundjava — jo më shumë se aq. */
var W0 = {
  unfilled:5000000,// qeli bosh — më e keqja: dokumenti duhet të ketë emër kudo
  pairFixed:900000,// çiftëzim i detyrueshëm i shkelur
  pairPref:400,    // çiftëzim i preferuar i pambuluar
  gap:2000000,     // dy kujdestari shumë afër
  hard:1000000,    // shkelje e patejkalueshme
  under:60000,     // nën minimumin e vet — prioritet i fortë
  load:900,        // ngarkesa e muajit kundrejt objektivit
  heavyMonth:700,  // fundjava e festa brenda muajit
  annual:900,      // bilanci vjetor relativ ndaj kuotës
  annualHeavy:800, // fundjavat kumulative gjatë vitit
  weOver:250000,   // mbi maksimumin e fundjavave — kufi, jo sugjerim:
                   // duhet të mbizotërojë çdo term drejtësie, që ndreqja e bilancit
                   // vjetor të mos e thyejë kufirin e vendosur në cilësime
  avoidPref:150,   // preferencë e shkelur
  pair:500, prefBonus:-90,
  space:4          // hapësira e njëtrajtshme brenda muajit
};

function solveRow(row, days, docs, opt){
  var minGap=opt.minGap, maxWe=opt.maxWeekend, rnd=opt.rand, hist=opt.history||{}, byId=opt.byId;
  // peshat mund të ndryshohen nga mënyra e balancimit e zgjedhur nga përdoruesi
  var W = opt.weights ? Object.assign({}, W0, opt.weights) : W0;
  var pool = docs.filter(function(d){ return d.block===row && d.doesDuty; });
  var D = days.length;
  if(!pool.length || !D) return {sol:{}, cost:0, metrics:null};

  var heavyDays = days.filter(function(x){ return x.weekend||x.holAll; }).length;
  var heavyRatio = heavyDays/D;

  /* kandidatët dhe disponueshmëria */
  var cand={}, avail={};
  days.forEach(function(day){ cand[day.date]=pool.filter(function(d){ return buildCand(d,day,opt.ambBusy); }); });
  pool.forEach(function(d){ var n=0;
    days.forEach(function(day){ if(buildCand(d,day,opt.ambBusy)) n++; }); avail[d.id]=n; });
  var live = pool.filter(function(d){ return avail[d.id]>0; });
  if(!live.length) return {sol:{}, cost:D*W.hard, metrics:null};

  /* objektivi i muajit: ditët ndahen sipas kapacitetit real, jo në mënyrë të verbër */
  var capSum=0; live.forEach(function(d){ capSum += Math.min(d.maxPerMonth, avail[d.id]); });
  var target={}, nominal={};
  live.forEach(function(d){
    var cap=Math.min(d.maxPerMonth, avail[d.id]);
    var tg = capSum>0 ? D*cap/capSum : 0;
    target[d.id] = Math.max(Math.min(d.minPerMonth,cap), Math.min(cap,tg));
  });
  pool.forEach(function(d){ nominal[d.id]=Math.max(0.5,(d.minPerMonth+d.maxPerMonth)/2); });

  var locked = opt.locked||{};

  /* Kufiri mes muajve: kujdestaria e fundit e muajit paraardhës shndërrohet në
     numër dite jo-pozitiv (dita e fundit e muajit të kaluar = 0), dhe e para e
     muajit pasardhës në numër më të madh se D. Kështu hapësira minimale vlen
     edhe përtej 31 dhjetorit, jo vetëm brenda kalendarit. */
  var pre={}, post={};
  (function(){
    var P=opt.prevDays||0, prevRow=(opt.prevRows&&opt.prevRows[row-1])||null;
    if(prevRow && P){
      Object.keys(prevRow).forEach(function(dt){
        var id=prevRow[dt], dn=parseInt(dt.slice(8),10);
        var idx=dn-P;                       // 0 = dita e fundit e muajit të kaluar
        if(pre[id]===undefined || idx>pre[id]) pre[id]=idx;
      });
    }
    var nextRow=(opt.nextRows&&opt.nextRows[row-1])||null;
    if(nextRow){
      Object.keys(nextRow).forEach(function(dt){
        var id=nextRow[dt], dn=parseInt(dt.slice(8),10);
        var idx=D+dn;                       // D+1 = dita e parë e muajit tjetër
        if(post[id]===undefined || idx<post[id]) post[id]=idx;
      });
    }
  })();
  function edgeBlocks(id, dayNum){
    if(pre[id]!==undefined && dayNum-pre[id] < minGap) return true;
    if(post[id]!==undefined && post[id]-dayNum < minGap) return true;
    return false;
  }

  function evaluate(sol){
    var n={}, hv={}, dts={};
    pool.forEach(function(d){ n[d.id]=0; hv[d.id]=0; dts[d.id]=[]; });
    var c=0, i, day, id, doc;
    for(i=0;i<D;i++){
      day=days[i]; id=sol[day.date];
      if(!id){ c+=W.unfilled; continue; }
      doc=byId[id]; if(!doc) continue;
      n[id]++; dts[id].push(day.d);
      if(day.weekend||day.holAll) hv[id]++;
      if(day.weekend && doc.wantsWeekend==='avoid') c+=W.avoidPref;
      if(day.holAll && doc.wantsStateHoliday==='avoid') c+=W.avoidPref;
      if(relHits(doc,day) && doc.wantsRelHoliday==='avoid') c+=W.avoidPref;
      var partners=opt.partnersFor(day.date);
      for(var k=0;k<partners.length;k++){
        if((doc.avoidWith||[]).indexOf(partners[k])>=0) c+=W.pair;
        if((doc.prefWith||[]).indexOf(partners[k])>=0) c+=W.prefBonus;
      }
      if(opt.pairCost) c += opt.pairCost(day.date, id);
    }
    var rels=[], sum=0;
    for(i=0;i<pool.length;i++){
      var d=pool[i], cnt=n[d.id]||0, h0=hist[d.id]||{};
      var ht=h0.total||0, hw=h0.weekend||0, hvi=hv[d.id]||0;

      if(cnt>d.maxPerMonth) c += (cnt-d.maxPerMonth)*W.hard;
      if(avail[d.id]>0 && cnt<d.minPerMonth){
        // sa më e ngushtë kuota, aq më e rëndë mosplotësimi:
        // një 1–1 që mbetet pa kujdestari peshon më shumë se një 2–3
        var tight = 4/Math.max(1,d.maxPerMonth);
        c += (d.minPerMonth-cnt)*W.under*tight;
      }
      if(hvi>maxWe) c += (hvi-maxWe)*W.weOver;

      // ngarkesa e muajit kundrejt objektivit
      if(target[d.id]!==undefined){ var dl=cnt-target[d.id]; c += dl*dl*W.load; }
      // fundjavat e muajit në përpjesëtim me kujdestaritë e tij
      var eH=cnt*heavyRatio, dh=hvi-eH; c += dh*dh*W.heavyMonth;
      // fundjavat kumulative gjatë vitit, po ashtu në përpjesëtim
      var eHY=(ht+cnt)*heavyRatio, dhy=(hw+hvi)-eHY; c += dhy*dhy*W.annualHeavy;
      // hapësirat brenda muajit
      var dd=dts[d.id];
      if(dd.length){
        if(pre[d.id]!==undefined){
          var g0=dd[0]-pre[d.id];
          if(g0<minGap) c += (minGap-g0)*W.gap;
        }
        if(post[d.id]!==undefined){
          var g1=post[d.id]-dd[dd.length-1];
          if(g1<minGap) c += (minGap-g1)*W.gap;
        }
      }
      for(var j=1;j<dd.length;j++){
        var g=dd[j]-dd[j-1];
        if(g<minGap) c += (minGap-g)*W.gap;
        else { var ideal=D/Math.max(1,cnt), e=g-ideal; c += e*e*W.space; }
      }
      if(avail[d.id]>0){ var rl=(ht+cnt)/nominal[d.id]; rels.push(rl); sum+=rl; }
    }
    // bilanci vjetor: varianca e ngarkesës relative ndaj kuotës së secilit
    if(rels.length>1){
      var mean=sum/rels.length;
      for(i=0;i<rels.length;i++){ var er=rels[i]-mean; c += er*er*W.annual; }
    }
    return c;
  }

  /* ---------- ndërtimi fillestar ---------- */
  function okPair(date,id){
    if(!opt.pairCheck) return true;
    return opt.pairCheck(date,id)!==false;
  }

  function build(){
    var sol={}, n={}, hv={}, last={};
    pool.forEach(function(d){ n[d.id]=0; hv[d.id]=0; last[d.id]=-99; });
    Object.keys(locked).forEach(function(dt){
      var id=locked[dt]; if(!byId[id]) return;
      sol[dt]=id; n[id]=(n[id]||0)+1;
      var day=days.filter(function(x){return x.date===dt;})[0];
      if(day){ if(day.weekend||day.holAll) hv[id]++; last[id]=day.d; }
    });
    var order=days.slice().sort(function(a,b){
      var ca=cand[a.date].length, cb=cand[b.date].length;
      if(ca!==cb) return ca-cb;
      var sa=(a.weekend||a.holAll)?0:1, sb=(b.weekend||b.holAll)?0:1;
      if(sa!==sb) return sa-sb;
      return rnd()-0.5;
    });

    /* FAZA 1 — minimumet, me përparësi për kuotat e ngushta.
       Kush ka 1–1 e mbush normën para se një 2–3 të marrë të tretën. */
    var byTight = live.slice().sort(function(a,b){
      if(a.maxPerMonth!==b.maxPerMonth) return a.maxPerMonth-b.maxPerMonth;
      if(avail[a.id]!==avail[b.id]) return avail[a.id]-avail[b.id];
      return rnd()-0.5;
    });
    byTight.forEach(function(d){
      var needed=d.minPerMonth-(n[d.id]||0);
      for(var q=0;q<needed;q++){
        var opts=order.filter(function(day){
          if(sol[day.date]) return false;
          if(!cand[day.date].some(function(x){return x.id===d.id;})) return false;
          if(last[d.id]>-99 && Math.abs(day.d-last[d.id])<minGap) return false;
          if(edgeBlocks(d.id, day.d)) return false;
          if((day.weekend||day.holAll) && hv[d.id]>=maxWe) return false;
          if(!okPair(day.date,d.id)) return false;
          return true;
        });
        if(!opts.length) break;
        // dita ku ka më pak kandidatë të tjerë — ruaj fleksibilitetin
        opts.sort(function(x,y2){
          var dx=cand[x.date].length, dy=cand[y2.date].length;
          if(dx!==dy) return dx-dy;
          return rnd()-0.5;
        });
        var day0=opts[0];
        sol[day0.date]=d.id; n[d.id]++;
        if(day0.weekend||day0.holAll) hv[d.id]++;
        last[d.id]=day0.d;
      }
    });

    /* FAZA 2 — ditët e mbetura */
    order.forEach(function(day){
      if(sol[day.date]) return;
      var isHeavy=day.weekend||day.holAll;
      var list=cand[day.date].filter(function(d){
        if(n[d.id]>=d.maxPerMonth) return false;
        if(last[d.id]>-99 && Math.abs(day.d-last[d.id])<minGap) return false;
        if(edgeBlocks(d.id, day.d)) return false;
        if(isHeavy && hv[d.id]>=maxWe) return false;
        if(!okPair(day.date,d.id)) return false;
        return true;
      });
      if(!list.length) list=cand[day.date].filter(function(d){
        return n[d.id]<d.maxPerMonth && !edgeBlocks(d.id, day.d); });
      if(!list.length) list=cand[day.date].filter(function(d){ return n[d.id]<d.maxPerMonth; });
      if(!list.length){
        // muaji nuk mbyllet brenda kuotave — më mirë emër mbi kuotë sesa qeli bosh
        list=cand[day.date].filter(function(d){
          return !(last[d.id]>-99 && Math.abs(day.d-last[d.id])<minGap); });
        if(!list.length) list=cand[day.date].slice();
      }
      if(!list.length) return;
      list.sort(function(a,b){
        // kush është më larg objektivit të vet vjen i pari
        var da=(n[a.id]-(target[a.id]||0)), db=(n[b.id]-(target[b.id]||0));
        if(Math.abs(da-db)>0.001) return da-db;
        if(isHeavy){
          var ha=(hist[a.id]||{}), hb=(hist[b.id]||{});
          var xa=((ha.weekend||0)+hv[a.id]) - ((ha.total||0)+n[a.id])*heavyRatio;
          var xb=((hb.weekend||0)+hv[b.id]) - ((hb.total||0)+n[b.id])*heavyRatio;
          if(Math.abs(xa-xb)>0.001) return xa-xb;
        }
        var ra=(((hist[a.id]||{}).total||0)+n[a.id])/nominal[a.id];
        var rb=(((hist[b.id]||{}).total||0)+n[b.id])/nominal[b.id];
        if(Math.abs(ra-rb)>0.001) return ra-rb;
        return rnd()-0.5;
      });
      var pick=list[ rnd()<0.8 ? 0 : Math.min(list.length-1, 1+Math.floor(rnd()*2)) ];
      sol[day.date]=pick.id; n[pick.id]++;
      if(isHeavy) hv[pick.id]++;
      last[pick.id]=day.d;
    });
    return sol;
  }

  /* ---------- kërkimi lokal me prag rënës ---------- */
  function refine(sol, iters, T0){
    var cur=evaluate(sol), best=cur, bestSol=Object.assign({},sol);
    var free=days.filter(function(x){ return !locked[x.date]; });
    if(free.length<2) return {sol:bestSol, cost:best};
    for(var it=0; it<iters; it++){
      var T = T0 * (1 - it/iters);
      var a=free[Math.floor(rnd()*free.length)], undo;
      if(rnd()<0.55){
        // zëvendëso një ditë
        var list=cand[a.date]; if(!list.length) continue;
        var pick=list[Math.floor(rnd()*list.length)];
        if(sol[a.date]===pick.id) continue;
        undo={d1:a.date, v1:sol[a.date]};
        sol[a.date]=pick.id;
      } else {
        // shkëmbe dy ditë
        var b=free[Math.floor(rnd()*free.length)];
        if(b.date===a.date) continue;
        var ia=sol[a.date], ib=sol[b.date];
        if(!ia||!ib||ia===ib) continue;
        if(!cand[a.date].some(function(x){return x.id===ib;})) continue;
        if(!cand[b.date].some(function(x){return x.id===ia;})) continue;
        undo={d1:a.date,v1:ia,d2:b.date,v2:ib};
        sol[a.date]=ib; sol[b.date]=ia;
      }
      var nc=evaluate(sol), delta=nc-cur;
      if(delta < T){
        cur=nc;
        if(nc<best){ best=nc; bestSol=Object.assign({},sol); }
      } else {
        sol[undo.d1]=undo.v1;
        if(undo.d2!==undefined) sol[undo.d2]=undo.v2;
      }
    }
    return {sol:bestSol, cost:best};
  }

  var starts = Math.max(6, Math.round((opt.restarts||400)/40));
  var iters  = Math.max(1500, (opt.polish||4000));
  var best=null, bestC=Infinity;
  for(var s0=0; s0<starts; s0++){
    var sol=build();
    var res=refine(sol, Math.round(iters/starts)+400, 1500);
    if(res.cost<bestC){ bestC=res.cost; best=res.sol; }
  }
  // rrafshim përfundimtar pa pranim të keqësimit
  var fin=refine(Object.assign({},best), Math.round(iters/2), 0);
  if(fin.cost<bestC){ bestC=fin.cost; best=fin.sol; }

  return {sol:best, cost:bestC, cand:cand, avail:avail, target:target};
}

function generateDuty(o){
  var days = monthDays(o.year,o.month,o.holidays);
  var docs = (o.doctors||[]).filter(function(d){ return d.active!==false; });
  var byId = {}; docs.forEach(function(d){ byId[d.id]=d; });
  var r = rng(o.seed||987654);

  // ditët e zëna nga ambulanta
  var ambBusy = {};
  (o.ambBlocks||[]).forEach(function(b){
    if(!b.doctorId) return;
    ambBusy[b.doctorId]=ambBusy[b.doctorId]||{};
    var d=b.from;
    while(d<=b.to){ ambBusy[b.doctorId][d]=1; d=addDays(d,1); }
  });

  var rows=[{},{},{}], targets=[{},{},{}], issues=[], stats={};
  var rules=o.rules||{};
  var minGaps = rules.minGap || [5,5,4];
  var maxWes  = rules.maxWeekend || [1,1,1];

  // sa ditë të mundshme ka secili brenda muajit
  var availDays={};
  docs.forEach(function(d){
    var n=0;
    days.forEach(function(day){ if(buildCand(d,day,ambBusy)) n++; });
    availDays[d.id]=n;
  });

  for(var row=1;row<=3;row++){
    var pool = docs.filter(function(d){ return d.block===row && d.doesDuty; });
    var live = pool.filter(function(d){ return availDays[d.id]>0; });
    // kapaciteti real: askush nuk jep më shumë se ditët që ka të lira
    var cap=0, need=days.length;
    live.forEach(function(d){ cap += Math.min(d.maxPerMonth, availDays[d.id]); });
    if(cap<need) issues.push({type:'capacity', row:row, have:cap, need:need, people:live.length});
    else if(live.length < Math.ceil(need/3)) issues.push({type:'thin', row:row, people:live.length, need:need});

    var res = solveRow(row, days, docs, {
      minGap:minGaps[row-1], maxWeekend:maxWes[row-1],
      byId:byId, history:o.history||{}, ambBusy:ambBusy, rand:r,
      locked:(o.locked&&o.locked[row])||{},
      prevRows:o.prevRows, prevDays:o.prevDays, nextRows:o.nextRows,
      restarts:rules.restarts||400, polish:rules.polish||4000, weights:rules.weights,
      partnersFor:function(date){
        var out=[];
        for(var i=0;i<row-1;i++){ if(rows[i][date]) out.push(rows[i][date]); }
        return out;
      },
      pairCheck:function(date,id){
        if(row===1) return true;
        var lead=byId[rows[0][date]];
        if(!lead || lead.pairMode!=='fixed') return true;
        var wl = row===2 ? (lead.pairWith2||[]) : (lead.pairWith3||[]);
        if(!wl.length) return true;
        return wl.indexOf(id)>=0;
      },
      pairCost:function(date,id){
        if(row===1) return 0;
        var lead=byId[rows[0][date]];
        if(!lead || !lead.pairMode || lead.pairMode==='off') return 0;
        var wl = row===2 ? (lead.pairWith2||[]) : (lead.pairWith3||[]);
        if(!wl.length) return 0;
        if(wl.indexOf(id)>=0) return lead.pairMode==='pref' ? W0.prefBonus*2 : 0;
        return lead.pairMode==='fixed' ? W0.pairFixed : W0.pairPref;
      }
    });
    rows[row-1]=res.sol;
    targets[row-1]=res.target||{};
    days.forEach(function(day){ if(!res.sol[day.date]) issues.push({type:'unfilled', row:row, date:day.date}); });
  }

  // statistika
  docs.forEach(function(d){ stats[d.id]={total:0,weekend:0,holiday:0,heavy:0,dates:[]}; });
  for(var i=0;i<3;i++){
    days.forEach(function(day){
      var id=rows[i][day.date]; if(!id||!stats[id]) return;
      stats[id].total++; stats[id].dates.push(day.date);
      if(day.weekend) stats[id].weekend++;
      if(day.holAll || day.holRel.length) stats[id].holiday++;
      // «e rëndë» = ajo që numëron motori për kufirin: fundjavë ose festë e përgjithshme
      if(day.weekend || day.holAll) stats[id].heavy++;
    });
  }
  docs.forEach(function(d){
    var s=stats[d.id]; if(!s) return;
    s.avail = availDays[d.id];
    if(d.doesDuty && availDays[d.id]>0 && s.total<d.minPerMonth)
      issues.push({type:'under', id:d.id, got:s.total, min:d.minPerMonth});
    if(s.total>d.maxPerMonth) issues.push({type:'over', id:d.id, got:s.total, max:d.maxPerMonth});
    // kufiri i fundjavave është ai i vendosur në cilësime, jo një numër i ngulitur
    var weLimit = maxWes[(d.block||1)-1];
    if(weLimit==null) weLimit=1;
    if(s.heavy>weLimit) issues.push({type:'weekend2', id:d.id, got:s.heavy, max:weLimit});
  });

  // treguesit e drejtësisë — matur ndaj objektivit të secilit, jo ndaj numrit të papërpunuar
  var heavyN=days.filter(function(x){return x.weekend||x.holAll;}).length;
  var hRatio=days.length?heavyN/days.length:0;
  var fair=[];
  for(var rr=1;rr<=3;rr++){
    var pl=docs.filter(function(d){ return d.block===rr && d.doesDuty && availDays[d.id]>0; });
    var tg=targets[rr-1]||{};
    var devMax=0, wDev=[], rel=[], tt=[], ww=[];
    pl.forEach(function(d){
      var s0=stats[d.id]||{total:0,weekend:0};
      var h0=(o.history&&o.history[d.id])||{total:0,weekend:0};
      tt.push(s0.total); ww.push(s0.weekend);
      if(tg[d.id]!==undefined){
        var dv=Math.abs(s0.total-tg[d.id]);
        if(dv>devMax) devMax=dv;
      }
      // fundjavat kumulative kundrejt asaj që i takon sipas ngarkesës
      var tot=(h0.total||0)+s0.total, wk=(h0.weekend||0)+s0.weekend;
      wDev.push(wk - tot*hRatio);
      var nom=Math.max(0.5,(d.minPerMonth+d.maxPerMonth)/2);
      rel.push(tot/nom);
    });
    function spr(v){ return v.length?Math.max.apply(null,v)-Math.min.apply(null,v):0; }
    var detail=[];
    var relMean=rel.length?rel.reduce(function(a,b){return a+b;},0)/rel.length:0;
    pl.forEach(function(d,ix){
      var s0=stats[d.id]||{total:0,weekend:0};
      var h0=(o.history&&o.history[d.id])||{total:0,weekend:0};
      var tot=(h0.total||0)+s0.total;
      detail.push({id:d.id, name:d.name,
        month:s0.total, target:tg[d.id]!==undefined?+tg[d.id].toFixed(1):null,
        dev: tg[d.id]!==undefined?+(s0.total-tg[d.id]).toFixed(1):0,
        weDev:+(wDev[ix]||0).toFixed(1),
        year:tot, yearWe:(h0.weekend||0)+s0.weekend,
        rel:+(rel[ix]||0).toFixed(2), relDev:+((rel[ix]||0)-relMean).toFixed(2)});
    });
    detail.sort(function(a,b){ return Math.abs(b.dev)+Math.abs(b.weDev)/2 - (Math.abs(a.dev)+Math.abs(a.weDev)/2); });
    fair.push({row:rr, people:pl.length, detail:detail,
      monthMin:tt.length?Math.min.apply(null,tt):0, monthMax:tt.length?Math.max.apply(null,tt):0,
      weMin:ww.length?Math.min.apply(null,ww):0, weMax:ww.length?Math.max.apply(null,ww):0,
      devMax:+devMax.toFixed(1),
      weDev:+spr(wDev).toFixed(1),
      yearSpread:+spr(rel).toFixed(2)});
  }

  return {days:days, rows:rows, stats:stats, issues:issues, avail:availDays, fair:fair};
}

/* ============================================================
   PARASHIKIMI — sa mjekë ka secili bllok muajt e ardhshëm
   ============================================================ */
function forecast(o){
  var out=[], y=o.year, m=o.month;
  for(var k=0;k<(o.months||6);k++){
    var hh = (o.holidaysFor?o.holidaysFor(y):o.holidays)||[];
    var days = monthDays(y,m,hh);
    var row=[0,0,0], cap=[0,0,0];
    (o.doctors||[]).forEach(function(d){
      if(d.active===false||!d.doesDuty||!d.block) return;
      var n=0;
      days.forEach(function(day){
        if(!inTurnus(d,day.date)) return;
        if(isAbsent(d,day.date)) return;
        if((d.skipWeekdays||[]).indexOf(day.w)>=0) return;
        n++;
      });
      if(n>0){ row[d.block-1]++; cap[d.block-1]+=Math.min(d.maxPerMonth,n); }
    });
    out.push({year:y, month:m, days:days.length, people:row, capacity:cap,
              short:[cap[0]<days.length, cap[1]<days.length, cap[2]<days.length]});
    m++; if(m>12){ m=1; y++; }
  }
  return out;
}

window.LB_ENGINE = {
  monthDays:monthDays, daysInMonth:daysInMonth,
  generateAmb:generateAmb, generateDuty:generateDuty,
  splitBlocks:splitBlocks, inTurnus:inTurnus, forecast:forecast, isAbsent:isAbsent
};
})();
/* ============================================================
   ANALIZA — çfarë po ndodh me personelin dhe çfarë duhet bërë
   Prodhon propozime konkrete, jo vetëm paralajmërime.
   ============================================================ */
(function(){ 'use strict';
var H=window.LB_HOL, E=window.LB_ENGINE;

function iso(y,m,d){ return H.iso(y,m,d); }

/* sa ditë të lira ka një mjek brenda një muaji */
function availIn(d, y, m, holidays){
  var days=E.monthDays(y,m,holidays||[]), n=0;
  days.forEach(function(day){
    if(!E.inTurnus(d,day.date)) return;
    if(E.isAbsent(d,day.date)) return;
    if((d.skipWeekdays||[]).indexOf(day.w)>=0) return;
    if(day.weekend && d.wantsWeekend==='never') return;
    n++;
  });
  return n;
}

/* sa ditë mungesë janë regjistruar për një muaj, gjithsej */
function absDaysIn(doctors, y, m){
  var a=iso(y,m,1), b=iso(y,m,E.daysInMonth(y,m)), n=0;
  (doctors||[]).forEach(function(d){
    (d.absences||[]).forEach(function(x){
      var f=typeof x==='string'?x:x.from, to=typeof x==='string'?x:(x.to||x.from);
      var c=f<a?a:f, e=to>b?b:to;
      while(c<=e){ n++; c=H.addDays(c,1); }
    });
  });
  return n;
}

function analyze(o){
  var doctors=o.doctors||[], hist=o.history||{}, year=o.year, month=o.month;
  var holFor = o.holidaysFor || function(){ return []; };
  var rules = o.rules || {minGap:[5,5,4], maxWeekend:[1,1,1]};
  var P=[], months=[];

  /* ---- projeksioni i muajve në vijim, me mungesat brenda ---- */
  var y=year, m=month;
  for(var k=0;k<(o.months||6);k++){
    var hh=holFor(y);
    var D=E.daysInMonth(y,m);
    var rec={year:y, month:m, days:D, rows:[], absDays:absDaysIn(doctors,y,m)};
    for(var r=1;r<=3;r++){
      var pool=doctors.filter(function(d){ return d.active!==false && d.doesDuty && d.block===r; });
      var live=[], cap=0, gapCap=0;
      var g=rules.minGap[r-1]||4;
      pool.forEach(function(d){
        var av=availIn(d,y,m,hh);
        if(av<=0) return;
        live.push(d);
        cap += Math.min(d.maxPerMonth, av);
        gapCap += Math.min(d.maxPerMonth, Math.floor((D-1)/g)+1, av);
      });
      rec.rows.push({row:r, people:live.length, capacity:cap, gapCapacity:gapCap,
                     short:cap<D, gapShort:gapCap<D, miss:Math.max(0,D-cap),
                     ids:live.map(function(d){return d.id;})});
    }
    months.push(rec);
    m++; if(m>12){ m=1; y++; }
  }

  var MN = o.monthName || function(y,m){ return m+'/'+y; };

  /* ---- 1. kapaciteti i muajve ---- */
  months.forEach(function(rec){
    rec.rows.forEach(function(rr){
      if(!rr.short && !rr.gapShort) return;
      var pool=doctors.filter(function(d){ return rr.ids.indexOf(d.id)>=0; });
      if(rr.short){
        // sa mjekë duhen të ngrenë maksimumin me 1
        var need=rr.miss;
        var cands=pool.filter(function(d){ return d.maxPerMonth<5; })
          .sort(function(a,b){ return a.maxPerMonth-b.maxPerMonth; }).slice(0,need);
        P.push({id:'cap-'+rec.year+'-'+rec.month+'-'+rr.row, sev:3, type:'capacity',
          data:{row:rr.row, month:MN(rec.year,rec.month), have:rr.capacity, need:rec.days, miss:rr.miss},
          fix: cands.length>=need ? {act:'raiseMax', ids:cands.map(function(d){return d.id;}), n:cands.length} : null});
      } else if(rr.gapShort){
        P.push({id:'gap-'+rec.year+'-'+rec.month+'-'+rr.row, sev:2, type:'gap',
          data:{row:rr.row, people:rr.people, gap:rules.minGap[rr.row-1]},
          fix:{act:'lowerGap', row:rr.row, v:Math.max(2,(rules.minGap[rr.row-1]||4)-1)}});
      }
    });
  });

  /* ---- 2. bilanci vjetor për person ---- */
  [1,2,3].forEach(function(r){
    var pool=doctors.filter(function(d){ return d.active!==false && d.doesDuty && d.block===r && !d.turnusTo; });
    if(pool.length<3) return;
    var rel=[], sum=0;
    pool.forEach(function(d){
      var h=hist[d.id]||{total:0,weekend:0};
      var nom=Math.max(0.5,(d.minPerMonth+d.maxPerMonth)/2);
      var v=(h.total||0)/nom; rel.push({d:d,v:v,h:h,nom:nom}); sum+=v;
    });
    var mean=sum/rel.length;
    if(mean<3) return;   // shumë herët në vit për të gjykuar
    rel.forEach(function(x){
      var diff=x.v-mean;
      if(diff < -mean*0.18 && x.d.maxPerMonth<5){
        P.push({id:'under-'+x.d.id, sev:1, type:'under',
          data:{name:x.d.name, got:x.h.total||0, exp:Math.round(mean*x.nom)},
          fix:{act:'raiseQuota', id:x.d.id, min:x.d.minPerMonth, max:x.d.maxPerMonth+1}});
      } else if(diff > mean*0.18 && x.d.maxPerMonth>1){
        P.push({id:'over-'+x.d.id, sev:1, type:'over',
          data:{name:x.d.name, got:x.h.total||0, exp:Math.round(mean*x.nom)},
          fix:{act:'lowerQuota', id:x.d.id, min:x.d.minPerMonth, max:x.d.maxPerMonth-1}});
      }
    });
    // fundjavat kumulative
    var hh0=holFor(year);
    var dd=E.monthDays(year,month,hh0);
    var ratio=dd.length? dd.filter(function(x){return x.weekend||x.holAll;}).length/dd.length : 0.3;
    pool.forEach(function(d){
      var h=hist[d.id]||{total:0,weekend:0};
      var exp=(h.total||0)*ratio;
      if((h.weekend||0) > exp+2.5 && d.wantsWeekend==='ok'){
        P.push({id:'we-'+d.id, sev:2, type:'weekend',
          data:{name:d.name, got:h.weekend||0, exp:Math.round(exp)},
          fix:{act:'avoidWeekend', id:d.id}});
      }
    });
  });

  /* ---- 3. turnuset që mbarojnë së shpejti ---- */
  var horizon=H.addDays(iso(year,month,1), 75);
  doctors.forEach(function(d){
    if(!d.turnusTo || d.active===false) return;
    if(d.turnusTo>=iso(year,month,1) && d.turnusTo<=horizon){
      P.push({id:'tur-'+d.id, sev:2, type:'turnusEnd', data:{name:d.name, date:LBfmt(d.turnusTo)}, fix:null});
    }
  });

  /* ---- 4. mungesa të rënda ---- */
  months.slice(0,3).forEach(function(rec){
    if(rec.absDays<8) return;
    var hit=rec.rows.filter(function(rr){ return rr.short||rr.gapShort; });
    if(!hit.length) return;
    P.push({id:'abs-'+rec.year+'-'+rec.month, sev:2, type:'absHeavy',
      data:{month:MN(rec.year,rec.month), days:rec.absDays, row:hit[0].row}, fix:null});
  });

  /* ---- 5. mjekë pa asnjë ditë të lirë ---- */
  var hhN=holFor(year);
  doctors.forEach(function(d){
    if(d.active===false || !d.doesDuty || d.minPerMonth<=0) return;
    if(!E.inTurnus(d, iso(year,month,15)) && !E.inTurnus(d, iso(year,month,1))) return;
    if(availIn(d,year,month,hhN)===0){
      P.push({id:'nod-'+d.id, sev:1, type:'noDuty', data:{name:d.name, min:d.minPerMonth}, fix:null});
    }
  });

  /* ---- 6. ambulanta ---- */
  var ambPool=doctors.filter(function(d){ return d.doesAmb && d.active!==false; });
  var needAmb=(o.ambBlocks||2)*3;
  if(ambPool.length<needAmb){
    P.push({id:'amb-short', sev:2, type:'ambShort', data:{n:ambPool.length, need:needAmb}, fix:null});
  }

  P.sort(function(a,b){ return b.sev-a.sev; });
  return {months:months, proposals:P};
}

function LBfmt(s){ var p=String(s).split('-'); return (+p[2])+'.'+(+p[1])+'.'+p[0].slice(2); }

/* ---- radha e ambulantës: kush ka qenë, kush pritet ---- */
function ambQueue(o){
  var doctors=(o.doctors||[]).filter(function(d){ return d.doesAmb && d.active!==false; });
  var hist=o.ambHistory||{};   // id -> {count, last:'YYYY-MM', dates:[]}
  var list=doctors.map(function(d){
    var h=hist[d.id]||{count:0,last:''};
    return {doc:d, count:h.count||0, last:h.last||'', order:(d.ambOrder==null?null:d.ambOrder)};
  });
  list.sort(function(a,b){
    if(a.order!=null && b.order!=null && a.order!==b.order) return a.order-b.order;
    if(a.order!=null && b.order==null) return -1;
    if(a.order==null && b.order!=null) return 1;
    if(a.count!==b.count) return a.count-b.count;
    if(a.last!==b.last) return a.last<b.last?-1:1;
    return a.doc.name<b.doc.name?-1:1;
  });
  return list;
}

window.LB_ANALYZE = { analyze:analyze, ambQueue:ambQueue, availIn:availIn, absDaysIn:absDaysIn };
})();
/* ============================================================
   DOCX — ndërtuar brenda shfletuesit, pa asnjë bibliotekë
   ZIP me metodën STORE + CRC32. Word e pranon pa kompresim.
   ============================================================ */
(function(){ 'use strict';

var CRC=(function(){ var t=new Uint32Array(256);
  for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; }
  return t; })();
function crc32(buf){ var c=0xFFFFFFFF;
  for(var i=0;i<buf.length;i++) c=CRC[(c^buf[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0; }
function utf8(s){ return new TextEncoder().encode(s); }

function zip(files){
  var parts=[], central=[], offset=0;
  files.forEach(function(f){
    var data=utf8(f.data), name=utf8(f.name), c=crc32(data);
    var lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0,true);
    lh.setUint16(8,0,true); lh.setUint16(10,0,true); lh.setUint16(12,0,true);
    lh.setUint32(14,c,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    var ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true);
    ch.setUint16(8,0,true); ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0,true);
    ch.setUint32(16,c,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true);
    ch.setUint16(34,0,true); ch.setUint16(36,0,true); ch.setUint32(38,0,true);
    ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30+name.length+data.length;
  });
  var cs=0; central.forEach(function(x){ cs+=x.length; });
  var end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true);
  end.setUint16(10,files.length,true); end.setUint32(12,cs,true); end.setUint32(16,offset,true);
  var all=parts.concat(central,[new Uint8Array(end.buffer)]);
  var total=0; all.forEach(function(x){ total+=x.length; });
  var out=new Uint8Array(total), pos=0;
  all.forEach(function(x){ out.set(x,pos); pos+=x.length; });
  return new Blob([out],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});

function esc(s){ return String(s==null?'':s)

var cfmCb=null;

/* ---------- tërhiq-dhe-lësho ----------
   Punon me pointer events, pra edhe me gisht edhe me mi.
   Verifikimi bëhet nga jashtë përmes LB_DND.validate/apply. */
var drag=null, ghost=null, moved=false, holdT=null;

function cellInfo(el){
  if(!el) return null;
  var b=el.closest ? el.closest('[data-a="pick"]') : null;
  if(!b) return null;
  return {el:b, r:+b.dataset.r, date:b.dataset.d};
}

function startDrag(info, x, y){
  drag=info; moved=true;
  info.el.classList.add('drag-src');
  ghost=document.getElementById('ghost');
  ghost.textContent = (window.LB_DND.label(info.r, info.date)||'—');
  ghost.style.display='block';
  ghost.style.left=x+'px'; ghost.style.top=y+'px';
  document.body.style.userSelect='none';
}
function endDrag(){
  if(drag) drag.el.classList.remove('drag-src');
  document.querySelectorAll('.drag-ok,.drag-no').forEach(function(x){ x.classList.remove('drag-ok','drag-no'); });
  if(ghost) ghost.style.display='none';
  document.body.style.userSelect='';
  drag=null; moved=false;
}

document.addEventListener('pointerdown', function(e){
  if(!window.LB_DND || !window.LB_DND.enabled()) return;
  var info=cellInfo(e.target);
  if(!info) return;
  var sx=e.clientX, sy=e.clientY;
  var pending=info;
  holdT=setTimeout(function(){
    if(pending) startDrag(pending, sx, sy);
  }, 260);
  var mv=function(ev){
    if(!drag && Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>14){
      clearTimeout(holdT); startDrag(pending, ev.clientX, ev.clientY);
    }
    if(!drag) return;
    ev.preventDefault();
    ghost.style.left=ev.clientX+'px'; ghost.style.top=ev.clientY+'px';
    var over=document.elementFromPoint(ev.clientX, ev.clientY);
    var ti=cellInfo(over);
    document.querySelectorAll('.drag-ok,.drag-no').forEach(function(x){ x.classList.remove('drag-ok','drag-no'); });
    if(ti && ti.el!==drag.el){
      ti.el.classList.add(ti.r===drag.r ? 'drag-ok' : 'drag-no');
    }
  };
  var up=function(ev){
    clearTimeout(holdT);
    document.removeEventListener('pointermove', mv);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', up);
    if(!drag){ pending=null; return; }
    var over=document.elementFromPoint(ev.clientX, ev.clientY);
    var ti=cellInfo(over);
    var src=drag;
    endDrag(); pending=null;
    if(ti && ti.el!==src.el) window.LB_DND.drop(src, ti);
  };
  document.addEventListener('pointermove', mv, {passive:false});
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
});

window.LB_UI = { toast:toast, confirmBox:confirmBox };

   DROPBOX — kopje rezervë dhe rikthim, pa server

(function(){ 'use strict';

var AUTH='https://www.dropbox.com/oauth2/authorize';
var TOKEN='https://api.dropboxapi.com/oauth2/token';
var CONTENT='https://content.dropboxapi.com/2';
var API='https://api.dropboxapi.com/2';

var cfg={key:'', tok:null};   // tok = {access, refresh, exp, account}

function b64url(buf){
  var s=btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
  return s.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function randomVerifier(){
  var a=new Uint8Array(64); crypto.getRandomValues(a);
  return b64url(a.buffer).slice(0,64);
}
function challenge(v){
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)).then(b64url);
}
/* URI-ja e kthimit: vetë faqja, pa parametra */
function redirectUri(){
  return location.origin + location.pathname;
}

function configure(key, tok){ cfg.key=key||''; cfg.tok=tok||null; }
function isLinked(){ return !!(cfg.tok && cfg.tok.refresh); }
function account(){ return cfg.tok && cfg.tok.account; }

/* ---------- hapi 1: dërgo përdoruesin te Dropbox ---------- */
function beginLink(){
  if(!cfg.key) return Promise.reject(new Error('nokey'));
  var v=randomVerifier();
  return challenge(v).then(function(ch){
    try{ sessionStorage.setItem('dbx_v', v); }catch(e){}
    var u=AUTH+'?client_id='+encodeURIComponent(cfg.key)+
      '&response_type=code&code_challenge='+ch+'&code_challenge_method=S256'+
      '&token_access_type=offline&redirect_uri='+encodeURIComponent(redirectUri());
    location.href=u;
  });
}

/* ---------- hapi 2: kthimi me kod ---------- */
function pendingCode(){
  var m=/[?&]code=([^&]+)/.exec(location.search);
  return m ? decodeURIComponent(m[1]) : null;
}
function finishLink(){
  var code=pendingCode();
  if(!code) return Promise.resolve(null);
  var v=null;
  try{ v=sessionStorage.getItem('dbx_v'); }catch(e){}
  if(!v) return Promise.resolve(null);
  var body=new URLSearchParams({
    code:code, grant_type:'authorization_code', client_id:cfg.key,
    code_verifier:v, redirect_uri:redirectUri()
  });
  return fetch(TOKEN,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})
    .then(function(r){ if(!r.ok) throw new Error('token'); return r.json(); })
    .then(function(j){
      try{ sessionStorage.removeItem('dbx_v'); }catch(e){}
      history.replaceState(null,'',redirectUri());
      cfg.tok={access:j.access_token, refresh:j.refresh_token,
               exp:Date.now()+(j.expires_in||14400)*1000, account:''};
      return whoAmI().then(function(){ return cfg.tok; });
    });
}

/* ---------- rifreskimi i tokenit ---------- */
function ensureToken(){
  if(!cfg.tok) return Promise.reject(new Error('unlinked'));
  if(cfg.tok.access && Date.now() < cfg.tok.exp-60000) return Promise.resolve(cfg.tok.access);
  var body=new URLSearchParams({
    grant_type:'refresh_token', refresh_token:cfg.tok.refresh, client_id:cfg.key
  });
  return fetch(TOKEN,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})
    .then(function(r){ if(!r.ok) throw new Error('refresh'); return r.json(); })
    .then(function(j){
      cfg.tok.access=j.access_token;
      cfg.tok.exp=Date.now()+(j.expires_in||14400)*1000;
      return cfg.tok.access;
    });
}
function whoAmI(){
  return ensureToken().then(function(tk){
    return fetch(API+'/users/get_current_account',{method:'POST',
      headers:{'Authorization':'Bearer '+tk}});
  }).then(function(r){ return r.ok?r.json():null; })
    .then(function(j){
      if(j && cfg.tok) cfg.tok.account=(j.name&&j.name.display_name)||j.email||'';
      return cfg.tok&&cfg.tok.account;
    }).catch(function(){ return ''; });
}

/* ---------- ngarkimi ---------- */
function upload(path, text){
  return ensureToken().then(function(tk){
    return fetch(CONTENT+'/files/upload',{
      method:'POST',
      headers:{
        'Authorization':'Bearer '+tk,
        'Content-Type':'application/octet-stream',
        'Dropbox-API-Arg':JSON.stringify({path:path, mode:'overwrite', mute:true, autorename:false})
      },
      body:new Blob([text],{type:'application/octet-stream'})
    });
  }).then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error(t.slice(0,120)); }); return r.json(); });
}
function download(path){
  return ensureToken().then(function(tk){
    return fetch(CONTENT+'/files/download',{
      method:'POST',
      headers:{'Authorization':'Bearer '+tk,'Dropbox-API-Arg':JSON.stringify({path:path})}
    });
  }).then(function(r){ if(!r.ok) throw new Error('download'); return r.text(); });
}
function list(folder){
  return ensureToken().then(function(tk){
    return fetch(API+'/files/list_folder',{
      method:'POST',
      headers:{'Authorization':'Bearer '+tk,'Content-Type':'application/json'},
      body:JSON.stringify({path:folder||'', limit:200})
    });
  }).then(function(r){ return r.ok?r.json():{entries:[]}; })
    .then(function(j){
      return (j.entries||[]).filter(function(e){ return e['.tag']==='file'; })
        .sort(function(a,b){ return a.name<b.name?1:-1; });
    }).catch(function(){ return []; });
}
function remove(path){
  return ensureToken().then(function(tk){
    return fetch(API+'/files/delete_v2',{
      method:'POST',
      headers:{'Authorization':'Bearer '+tk,'Content-Type':'application/json'},
      body:JSON.stringify({path:path})
    });
  }).catch(function(){});
}

/* ---------- gjurma e përmbajtjes, që të mos ngarkohet e njëjta gjë ---------- */
function fingerprint(text){
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(b64url);
}

window.LB_DBX = {
  configure:configure, isLinked:isLinked, account:account,
  beginLink:beginLink, finishLink:finishLink, pendingCode:pendingCode,
  redirectUri:redirectUri, ensureToken:ensureToken,
  upload:upload, download:download, list:list, remove:remove,
  fingerprint:fingerprint, tok:function(){ return cfg.tok; }
};
})();

(function(){ 'use strict';

function stamp(){ S.settings.lastChange=Date.now(); return LB.set('settings',S.settings); }

function loadHolidays(y){

    if(h && h.length) { S.hol=h; return h; }

    S.theme = S.settings.theme || 'auto';

  }).then(loadUndo).then(dbxLoad).then(function(){ return loadMonth(); });
}
function refreshHistory(){ return buildHistory().then(function(h){ S.hist=h; return h; }); }
function refreshEdge(){
  return neighbours().then(function(nb){
    var pre=[{},{},{}], post=[{},{},{}];
    if(nb.prevRows) for(var r=0;r<3;r++) Object.keys(nb.prevRows[r]||{}).forEach(function(dt){
      var id=nb.prevRows[r][dt], idx=parseInt(dt.slice(8),10)-nb.prevDays;

  S.byId={}; S.doctors.forEach(function(d){ S.byId[d.id]=d; });

    .then(function(m){ S.month = m || blankMonth();

    .then(loadYearStats).then(refreshHistory).then(refreshEdge);

function loadYearStats(){
  var y=S.y, keys=[];
  for(var m=1;m<=12;m++) keys.push('month:'+LB.mk(y,m));

    var st={};
    function bump(id,f){ if(!id) return; st[id]=st[id]||{total:0,weekend:0,holiday:0,amb:0,months:0}; st[id][f]++; }
    list.forEach(function(v,ix){
      if(!v) return;
      var mo=ix+1, days=E.monthDays(y,mo,S.holCache&&S.holCache[y]||[]);
      var seen={};
      for(var r=0;r<3;r++) days.forEach(function(day){

      sorted.forEach(function(dt){
        if(st===null){ st=dt; pv=dt; return; }
        if(H.addDays(pv,1)===dt){ pv=dt; return; }
        out.push({from:st,to:pv,note:''}); st=dt; pv=dt;
      });
      if(st) out.push({from:st,to:pv,note:''});
      d.absences=out; changed=true;
    }
  });
  if(changed) saveDoctors();
}

/* ============ historia kumulative ============ */
function buildHistory(){
  return LB.keys().then(function(ks){
    var mkeys = ks.filter(function(k){ return typeof k==='string' && k.indexOf('month:')===0 && k!==monthKey(); });
    return Promise.all(mkeys.map(function(k){ return LB.get(k).then(function(v){ return {k:k,v:v}; }); }));
  }).then(function(list){
    var hist={};
    function bump(id,f){ if(!id) return; hist[id]=hist[id]||{total:0,weekend:0,holiday:0,amb:0}; hist[id][f]++; }
    list.forEach(function(x){
      if(!x.v) return;
      var ym=x.k.slice(6).split('-'), y=+ym[0], mo=+ym[1];
      var days = E.monthDays(y,mo,[]);
      for(var r=0;r<3;r++){
        days.forEach(function(day){
          var id=(x.v.rows[r]||{})[day.date]; if(!id) return;
          bump(id,'total'); if(day.weekend) bump(id,'weekend');
        });
      }
      (x.v.amb||[]).forEach(function(b){
        if(!b.doctorId) return;
        bump(b.doctorId,'amb');
        var mkey=x.k.slice(6);
        if(!hist[b.doctorId].lastAmb || hist[b.doctorId].lastAmb<mkey) hist[b.doctorId].lastAmb=mkey;
      });
    });
    return hist;
  });
}

/* muajt fqinjë — që hapësira minimale të vlejë edhe përtej fundit të muajit */
function neighbours(){
  var pm = S.m===1?{y:S.y-1,m:12}:{y:S.y,m:S.m-1};
  var nm = S.m===12?{y:S.y+1,m:1}:{y:S.y,m:S.m+1};
  return Promise.all([LB.get('month:'+LB.mk(pm.y,pm.m)), LB.get('month:'+LB.mk(nm.y,nm.m))])
    .then(function(r){
      return {
        prevRows: r[0]&&r[0].rows ? r[0].rows : null,
        prevDays: E.daysInMonth(pm.y,pm.m),
        nextRows: r[1]&&r[1].rows ? r[1].rows : null
      };
    });
}

/* Fiksimet e ambulantës ruhen me datën e fillimit të bllokut. Kur ndryshon numri
   i blloqeve, ato data zhvendosen — pra i rilidhim me bllokun që e përmban datën. */
function remapAmbLocks(){
  var L=S.month.lockedAmb||{};
  var keys=Object.keys(L);
  if(!keys.length) return {moved:0, lost:0};
  var days=E.monthDays(S.y,S.m,S.hol);
  var blocks=E.splitBlocks(days, S.settings.ambBlocks);
  var out={}, moved=0, lost=0;
  keys.forEach(function(k){
    if(blocks.some(function(b){ return b.from===k; })){ out[k]=L[k]; return; }
    var hit=null;
    for(var i=0;i<blocks.length;i++){ if(k>=blocks[i].from && k<=blocks[i].to){ hit=blocks[i]; break; } }
    if(hit && !out[hit.from]){ out[hit.from]=L[k]; moved++; }
    else lost++;
  });
  S.month.lockedAmb=out;
  return {moved:moved, lost:lost};
}
function doGenerateAmb(){
  var rm=remapAmbLocks();
  return buildHistory().then(function(hist){
    var res = E.generateAmb({
      year:S.y, month:S.m, doctors:S.doctors, holidays:S.hol,
      blocksPerMonth:S.settings.ambBlocks, history:hist,
      lockedAmb:S.month.lockedAmb, seed:Date.now()&0xffff
    });
    S.month.amb = res.blocks;
    S.month.ambIssues = res.issues;
    logChange('chAmb',{});
    return saveMonth();
  }).then(function(){
    if(rm.moved) toast(tpl(t('ambRelocked'),{n:rm.moved}),'warn');
    if(rm.lost)  toast(tpl(t('ambLockLost'),{n:rm.lost}),'bad');
  });
}
/* harta e ditëve të fiksuara: data -> ID e mjekut, jo thjesht «true» */
function lockedMap(r){
  var o={}, L=(S.month.locked&&S.month.locked[r])||{};
  Object.keys(L).forEach(function(dt){
    if(!L[dt]) return;
    var id=S.month.rows[r][dt];
    if(id) o[dt]=id;
  });
  return o;
}
function doGenerateDuty(){
  return Promise.all([buildHistory(), neighbours()]).then(function(rr){
    var hist=rr[0], nb=rr[1];
    var res = E.generateDuty({
      year:S.y, month:S.m, doctors:S.doctors, holidays:S.hol,
      ambBlocks:S.month.amb||[], history:hist,
      prevRows:nb.prevRows, prevDays:nb.prevDays, nextRows:nb.nextRows,
      locked:{1:lockedMap(0), 2:lockedMap(1), 3:lockedMap(2)},
      rules:{ minGap:S.settings.minGap, maxWeekend:S.settings.maxWeekend,
              restarts:S.settings.quality, polish:S.settings.quality*10 },
      seed:Date.now()&0xffff
    });
    S.month.rows = res.rows;
    S.month.issues = res.issues;
    S.month.avail = res.avail;
    S.month.fair = res.fair;
    S.hist = hist;
    return saveMonth().then(loadYearStats);
  });
}
