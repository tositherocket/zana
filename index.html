/* pse një mjek nuk mund ta marrë një ditë — arsye e fortë ose paralajmërim */
function checkPlace(docId, r, date, ignoreDate){
  var d=S.byId[docId]; if(!d) return {hard:'—'};
  var days=dayInfo(), day=null;
  for(var i=0;i<days.length;i++) if(days[i].date===date){ day=days[i]; break; }
  if(!day) return {hard:'—'};
  if(d.block!==r+1) return {hard:t('moveNoRow')};
  if(E.isAbsent(d,date)) return {hard:tpl(t('moveNoAbs'),{name:d.name,date:LB.fmtShort(date)})};
  if(!E.inTurnus(d,date)) return {hard:tpl(t('moveNoTurnus'),{name:d.name,date:LB.fmtShort(date)})};
  var busy=ambBusyMap();
  if(busy[docId]&&busy[docId][date]) return {hard:tpl(t('moveNoAmb'),{name:d.name,date:LB.fmtShort(date)})};
  if((d.skipWeekdays||[]).indexOf(day.w)>=0) return {hard:tpl(t('moveNoWd'),{name:d.name,dow:t('dows')[day.w]})};
  if(day.weekend && d.wantsWeekend==='never') return {hard:tpl(t('moveNoWe'),{name:d.name})};
  if(day.holAll && d.wantsStateHoliday==='never')
    return {hard:tpl(t('moveNoHolS'),{name:d.name,date:LB.fmtShort(date)})};
  if(d.wantsRelHoliday==='never' && (day.holRel||[]).some(function(x){ return x.scope===d.religion; }))
    return {hard:tpl(t('moveNoHolR'),{name:d.name,date:LB.fmtShort(date)})};

  // paralajmërime balancimi
  var warns=[], cnt=0, we=0, dates=[];
  days.forEach(function(x){
    if(x.date===ignoreDate) return;
    if(S.month.rows[r][x.date]===docId && x.date!==date){ cnt++; dates.push(x.d); if(x.weekend||x.holAll) we++; }
  });
  cnt++; if(day.weekend||day.holAll) we++;
  dates.push(day.d); dates.sort(function(a,b){return a-b;});
  var gap=S.settings.minGap[r]||4, minSeen=99;
  for(var j=1;j<dates.length;j++) minSeen=Math.min(minSeen, dates[j]-dates[j-1]);
  if(S.edge){
    var pe=S.edge.pre&&S.edge.pre[r]&&S.edge.pre[r][docId];
    var po=S.edge.post&&S.edge.post[r]&&S.edge.post[r][docId];
    if(pe!==undefined) minSeen=Math.min(minSeen, dates[0]-pe);
    if(po!==undefined) minSeen=Math.min(minSeen, po-dates[dates.length-1]);
  }
  if(minSeen<gap) warns.push(tpl(t('moveWarnGap'),{name:d.name,g:minSeen}));
  if(cnt>d.maxPerMonth) warns.push(tpl(t('moveWarnMax'),{name:d.name,n:cnt,max:d.maxPerMonth}));
  if(we>(S.settings.maxWeekend[r]||1)) warns.push(tpl(t('moveWarnWe'),{name:d.name,n:we}));
  return {warns:warns};
}

function dropCell(src,dst){
  if(src.r!==dst.r){ toast(t('moveNoRow'),'bad'); return; }
  var r=src.r, a=S.month.rows[r][src.date], b=S.month.rows[r][dst.date];
  if(!a) return;
  var ca=checkPlace(a, r, dst.date, src.date);
  if(ca.hard){ toast(ca.hard,'bad'); return; }
  var cb=null;
  if(b){
    cb=checkPlace(b, r, src.date, dst.date);
    if(cb.hard){ toast(cb.hard,'bad'); return; }
  }
  snapshot(t('actMove'));
  if(b) logChange('chSwap',{a:nameOf(a),b:nameOf(b),from:src.date,to:dst.date});
  else  logChange('chMove',{a:nameOf(a),from:src.date,to:dst.date});
  S.month.rows[r][dst.date]=a;
  if(b) S.month.rows[r][src.date]=b; else delete S.month.rows[r][src.date];
  S.month.locked[r][dst.date]=true;
  if(b) S.month.locked[r][src.date]=true; else delete S.month.locked[r][src.date];
  var warns=(ca.warns||[]).concat(cb?(cb.warns||[]):[]);
  saveMonth().then(function(){
    render();
    if(b) toast(tpl(t('moveSwap'),{a:nameOf(a),b:nameOf(b)}),'ok');
    else toast(tpl(t('moveOk'),{name:nameOf(a),date:LB.fmtShort(dst.date)}),'ok');
    warns.slice(0,2).forEach(function(w){ setTimeout(function(){ toast(w,'warn'); }, 260); });
  });
}

/* ============ përditësimi pas mungesave të reja ============ */
function conflictDays(){
  var days=dayInfo(), busy=ambBusyMap(), out=[];
  for(var r=0;r<3;r++) days.forEach(function(day){
    var id=S.month.rows[r][day.date]; if(!id) return;
    var d=S.byId[id]; if(!d) return;
    var bad = E.isAbsent(d,day.date) || !E.inTurnus(d,day.date) ||
              (busy[id]&&busy[id][day.date]) || d.active===false ||
              ((d.skipWeekdays||[]).indexOf(day.w)>=0) ||
              (day.weekend && d.wantsWeekend==='never') ||
              (day.holAll && d.wantsStateHoliday==='never') ||
              (d.wantsRelHoliday==='never' &&
               (day.holRel||[]).some(function(x){ return x.scope===d.religion; }));
    if(bad) out.push({r:r, date:day.date, id:id, locked:!!(S.month.locked[r]&&S.month.locked[r][day.date])});
  });
  return out;
}
function doUpdate(){
  var cf=conflictDays();
  var free=cf.filter(function(x){ return !x.locked; });
  var lockedBad=cf.filter(function(x){ return x.locked; });
  if(!free.length){
    toast(t('updNone'),'ok');
    if(lockedBad.length) toast(tpl(t('updLocked'),{n:lockedBad.length}),'warn');
    return Promise.resolve();
  }
  var lines=free.slice(0,6).map(function(x){
    return LB.fmtShort(x.date)+' · '+t('row'+(x.r+1))+' · '+nameOf(x.id); });
  if(free.length>6) lines.push('…');
  return confirmBox({title:t('updTitle'), msg:tpl(t('updMsg'),{n:free.length}),
      lines:lines, yes:t('yes'), no:t('no')}).then(function(ok){
    if(!ok) return;
    // gjithçka tjetër ngrihet përkohësisht, që të ndryshojnë vetëm ditët me konflikt
    var days=dayInfo(), keep=[{},{},{}];
    for(var r=0;r<3;r++) days.forEach(function(day){
      var id=S.month.rows[r][day.date]; if(!id) return;
      var isFree=free.some(function(x){ return x.r===r && x.date===day.date; });
      if(!isFree) keep[r][day.date]=id;
    });
    snapshot(t('actUpd'));
    free.forEach(function(x){ delete S.month.rows[x.r][x.date]; });
    return Promise.all([buildHistory(), neighbours()]).then(function(rr){
      var hist=rr[0], nb=rr[1];
      var res=E.generateDuty({
        year:S.y, month:S.m, doctors:S.doctors, holidays:S.hol,
        ambBlocks:S.month.amb||[], history:hist,
        prevRows:nb.prevRows, prevDays:nb.prevDays, nextRows:nb.nextRows,
        locked:{1:keep[0], 2:keep[1], 3:keep[2]},
        rules:{minGap:S.settings.minGap, maxWeekend:S.settings.maxWeekend,
               restarts:S.settings.quality, polish:S.settings.quality*10},
        seed:Date.now()&0xffff
      });
      S.month.rows=res.rows; S.month.issues=res.issues;
      S.month.avail=res.avail; S.month.fair=res.fair; S.hist=hist;
      logChange('chUpd',{n:free.length});
      return saveMonth();
    }).then(loadYearStats).then(function(){
      render();
      toast(tpl(t('updMsg'),{n:free.length}),'ok');
      if(lockedBad.length) toast(tpl(t('updLocked'),{n:lockedBad.length}),'warn');
    });
  });
}

/* peshat sipas mënyrës */
function modeRules(){
  var r={minGap:S.settings.minGap, maxWeekend:S.settings.maxWeekend,
         restarts:S.settings.quality, polish:S.settings.quality*10};
  if(GEN.mode==='month') r.weights={annual:0, annualHeavy:0, load:1400, heavyMonth:1100};
  if(GEN.mode==='pref')  r.weights={avoidPref:900, pairPref:1200, annual:400};
  return r;
}
/* ditët që NUK duhen prekur, sipas fushëveprimit */
function scopeLocks(){
  var days=dayInfo(), L={1:{},2:{},3:{}};
  for(var r=0;r<3;r++){
    var keep = !GEN.rows[r];
    days.forEach(function(day){
      var id=S.month.rows[r][day.date];
      if(!id) return;
      if(keep || GEN.onlyEmpty || (S.month.locked[r]&&S.month.locked[r][day.date])) L[r+1][day.date]=id;
    });
  }
  return L;
}
function runGeneration(seed){
  return Promise.all([buildHistory(), neighbours()]).then(function(rr){
    return E.generateDuty({
      year:S.y, month:S.m, doctors:S.doctors, holidays:S.hol,
      ambBlocks:S.month.amb||[], history:rr[0],
      prevRows:rr[1].prevRows, prevDays:rr[1].prevDays, nextRows:rr[1].nextRows,
      locked:scopeLocks(), rules:modeRules(), seed:seed
    });
  });
}
function diffFromCurrent(res){
  var days=dayInfo(), n=0;
  for(var r=0;r<3;r++) days.forEach(function(day){
    if((res.rows[r]||{})[day.date] !== S.month.rows[r][day.date]) n++;
  });
  return n;
}
function variantScore(res){
  var dev=0, we=0;
  (res.fair||[]).forEach(function(f){ if(f.devMax>dev) dev=f.devMax; if(f.weDev>we) we=f.weDev; });
  var iss=(res.issues||[]).filter(function(i){ return i.type!=='thin'; }).length;
  return {dev:dev, we:we, iss:iss, diff:diffFromCurrent(res), score:iss*10+dev*3+we};
}
function sheetVariants(){
  sheet(t('variants'), '<div class="empty">'+esc(t('generating'))+'</div>', '', true);
  var seeds=[1111,4444,9999], out=[];
  var chain=Promise.resolve();
  seeds.forEach(function(sd){
    chain=chain.then(function(){ return runGeneration(sd); }).then(function(r){ out.push({seed:sd,res:r}); });
  });
  chain.then(function(){
    GEN.variants=out;
    var scored=out.map(function(v,i){ return Object.assign({i:i}, variantScore(v.res)); });
    var best=scored.slice().sort(function(a,b){ if(a.score!==b.score) return a.score-b.score; return a.diff-b.diff; })[0];
    var b='';
    scored.forEach(function(sc,i){
      b+='<div class="vr'+(sc.i===best.i?' best':'')+'">'+
        '<div class="h"><b>'+(i+1)+'</b>'+
        (sc.i===best.i?'<span class="chip t">'+esc(t('vBest'))+'</span>':'')+
        '<button class="btn sm pri" data-a="useVariant" data-i="'+sc.i+'">'+esc(t('useThis'))+'</button></div>'+
        '<div class="m">'+
          '<span>'+esc(t('vTarget'))+' <i>±'+sc.dev+'</i></span>'+
          '<span>'+esc(t('vWe'))+' <i>±'+sc.we+'</i></span>'+
          '<span>'+esc(t('vIssues'))+' <i>'+sc.iss+'</i></span>'+
          '<span>'+(sc.diff?'<i>'+sc.diff+'</i> '+esc(t('vDiff')):esc(t('vSame')))+'</span>'+
        '</div></div>';
    });
    sheet(t('pickVariant'), b, '<button class="btn gh" data-a="closeSheet">'+esc(t('cancel'))+'</button>', true);
  });
}

  logChange('chGen',{});
  S.month.rows=res.rows; S.month.issues=res.issues;

function logChange(key, data){
  if(!S.month) return;
  S.month.log=S.month.log||[];

function ambOverlaps(from,to,skipIx){
  return (S.month.amb||[]).some(function(b,i){
    if(i===skipIx) return false;
    return from<=b.to && to>=b.from;
  });
}
function ambDutyCount(docId,from,to){
  var n=0, d=from;
  while(d<=to){
    for(var r=0;r<3;r++) if(S.month.rows[r][d]===docId) n++;
    d=H.addDays(d,1);
  }
  return n;
}

/* ============ Dropbox ============ */
var DBXS={key:'', tok:null, auto:true, last:0, fp:''};
function dbxLoad(){
  return LB.get('dropbox').then(function(v){
    DBXS=Object.assign(DBXS, v||{});
    DBX.configure(DBXS.key, DBXS.tok);
    // kthimi nga faqja e autorizimit
    if(DBX.pendingCode()){
      return DBX.finishLink().then(function(tk){
        if(!tk) return;
        DBXS.tok=tk;
        return dbxSave().then(function(){ toast(tpl(t('dbxLinked'),{n:tk.account||'—'}),'ok'); });
      }).catch(function(){ toast(t('dbxErr'),'bad'); });
    }
  }).catch(function(){});
}
function dbxSave(){ return LB.set('dropbox', DBXS); }

function collectAll(){
  return LB.keys().then(function(ks){
    return Promise.all(ks.filter(function(k){ return k!=='dropbox' && k!=='undo'; })
      .map(function(k){ return LB.get(k).then(function(v){ return [k,v]; }); }));
  }).then(function(pairs){
    var o={_v:1,_at:new Date().toISOString(),data:{}};
    pairs.forEach(function(p){ o.data[p[0]]=p[1]; });
    return JSON.stringify(o);
  });
}

function dbxUpload(silent){
  if(!DBX.isLinked()) return Promise.resolve(false);
  var txt;
  return collectAll().then(function(js){
    txt=js; return DBX.fingerprint(js);
  }).then(function(fp){
    if(fp===DBXS.fp){ if(!silent) toast(t('dbxSame')); return false; }
    var day=new Date().toISOString().slice(0,10);
    return DBX.upload('/kujdestari-backup.json', txt)
      .then(function(){ return DBX.upload('/versions/kujdestari-'+day+'.json', txt); })
      .then(function(){
        DBXS.fp=fp; DBXS.last=Date.now();
        S.settings.lastBackup=Date.now();
        return Promise.all([dbxSave(), saveSettings()]);
      }).then(function(){ if(!silent) toast(t('dbxOk'),'ok'); return true; });
  }).catch(function(){ if(!silent) toast(t('dbxErr'),'bad'); return false; });
}

var dbxTimer=null;
function dbxAutoQueue(){
  if(!DBXS.auto || !DBX.isLinked()) return;
  clearTimeout(dbxTimer);
  dbxTimer=setTimeout(function(){ dbxUpload(true).then(function(ok){ if(ok) render(); }); }, 8000);
}

/* ---------- MUNGESAT ---------- */
function absCount(d,y){
  var n=0;
  (d.absences||[]).forEach(function(a){
    if(typeof a==='string'){ if(a.slice(0,4)==String(y)) n++; return; }
    var f=a.from, to=a.to||a.from;
    while(f<=to){ if(f.slice(0,4)==String(y)) n++; f=H.addDays(f,1); }
  });
  return n;
}
function absRanges(){
  var out=[];
  S.doctors.forEach(function(d){
    (d.absences||[]).forEach(function(a,i){
      var f=typeof a==='string'?a:a.from, to=typeof a==='string'?a:(a.to||a.from);
      var n=0,c=f; while(c<=to){ n++; c=H.addDays(c,1); }
      out.push({doc:d, from:f, to:to, note:(typeof a==='string'?'':(a.note||'')),
                at:(typeof a==='string'?0:(a.at||0)), days:n, ref:a});
    });
  });
  return out;
}
function overlapsMonth(r,y,m){
  var a=H.iso(y,m,1), b=H.iso(y,m,E.daysInMonth(y,m));
  return r.from<=b && r.to>=a;
}
function viewAbs(){
  var nm = S.m===12?{y:S.y+1,m:1}:{y:S.y,m:S.m+1};
  var all=absRanges();
  var list;
  if(S.absView==='this') list=all.filter(function(r){ return overlapsMonth(r,S.y,S.m); });
  else if(S.absView==='next') list=all.filter(function(r){ return overlapsMonth(r,nm.y,nm.m); });
  else list=all.filter(function(r){ return r.to>=H.iso(S.y,1,1); });
  // më të rejat e regjistruara sipër
  list.sort(function(a,b){ if(b.at!==a.at) return b.at-a.at; return a.from<b.from?-1:1; });

  var h='<div class="seg" style="margin-bottom:12px" data-seg="absView">'+
    '<button data-v="this" class="'+(S.absView==='this'?'on':'')+'">'+esc(t('months')[S.m-1])+'</button>'+
    '<button data-v="next" class="'+(S.absView==='next'?'on':'')+'">'+esc(t('months')[nm.m-1])+'</button>'+
    '<button data-v="all" class="'+(S.absView==='all'?'on':'')+'">'+esc(t('reqAll'))+'</button></div>';

  h+='<div class="card"><h2>'+esc(t('requests'))+' · '+list.length+'</h2>';
  if(!list.length) h+='<div class="empty">'+esc(t('reqNone'))+'</div>';
  list.forEach(function(r){
    h+='<button class="rq" data-a="editAbs" data-id="'+r.doc.id+'">'+
      '<span class="dt"><b>'+esc(LB.fmtShort(r.from))+(r.from!==r.to?' – '+esc(LB.fmtShort(r.to)):'')+'</b>'+
      '<span>'+r.days+' '+esc(t('absDays'))+'</span></span>'+
      '<span class="bd"><b>'+esc(r.doc.name)+'</b><span>'+esc(t('row'+r.doc.block))+
        (r.note?' · '+esc(r.note):'')+
        (r.at?' · '+esc(t('recorded'))+' '+esc(new Date(r.at).toLocaleDateString(S.lang==='mk'?'mk-MK':'sq-AL',{day:'2-digit',month:'2-digit'})):'')+
      '</span></span></button>';
  });
  h+='</div>';

  h+='<div class="card"><h2>'+esc(t('allDoctors'))+'</h2>';
  [1,2,3].forEach(function(b){
    var dl=S.doctors.filter(function(d){ return d.block===b && d.active!==false; });
    h+='<div class="bhdr">'+esc(t('row'+b))+' · '+dl.length+'</div>';
    dl.forEach(function(d){ h+=docRow(d,{action:'editAbs', abs:absCount(d,S.y)}); });
  });
  h+='</div>';
  return h;
}

function monthName(y,m){ return t('months')[m-1]+' '+String(y).slice(2); }
function holFor(y){ return H.buildYear(y,(S.settings.bajram&&S.settings.bajram[y])||H.defaultBajram[y]||{}); }

function runAnalysis(){
  return AN.analyze({
    year:S.y, month:S.m, months:6, doctors:S.doctors, history:S.hist||{},
    holidaysFor:holFor, rules:{minGap:S.settings.minGap, maxWeekend:S.settings.maxWeekend},
    ambBlocks:S.settings.ambBlocks, monthName:monthName
  });
}

      else if(p.fix.act==='lowerQuota') fixLbl=tpl(t('p_overFix'),p.fix);

    }

      '<div style="display:flex;gap:8px;align-items:flex-start">'+
      '<span class="chip '+sev+'">'+esc(p.sev>=3?t('sev_high'):(p.sev===2?t('sev_mid'):t('sev_low')))+'</span>'+

     esc(t('row3'))+'</th><th>'+esc(t('tab_abs'))+'</th></tr></thead><tbody>';

/* ---------- INFO (brenda cilësimeve) ---------- */
function infoSection(){
  var dup={}, dupN=[], badT=[], noAv=[];

    var k=d.name.trim().toLowerCase().replace(/\s+/g,' ');
    if(dup[k]) dupN.push(d.name); else dup[k]=1;
    if(d.turnusFrom && d.turnusTo && d.turnusTo<d.turnusFrom) badT.push(d.name);
    if(d.doesDuty && d.active!==false && S.month.avail && S.month.avail[d.id]===0) noAv.push(d.name);
  });

  var turn=S.doctors.filter(function(d){ return d.turnusTo; }).length;

    '<span style="flex:1;font-size:12.5px;color:var(--muted)">'+esc(k)+'</span>'+
    '<span style="font-size:12.5px'+(cls?';color:var(--'+cls+')':'')+'">'+esc(v)+'</span></div>'; }

  h+=row(t('lastBackup'), S.settings.lastBackup?new Date(S.settings.lastBackup).toLocaleString():t('never'),
         S.settings.lastBackup?'':'rose');

  h+=row(t('dbx'), DBX.isLinked()?(DBX.account()||'✓'):t('dbxNotLinked'), DBX.isLinked()?'':'faint');
  h+=row(t('tab_docs'), S.doctors.length+' ('+counts.join(' / ')+')');
  h+=row(t('amb'), amb+' '+t('people'));
  h+=row(t('volunteer'), vols+' '+t('people'));
  h+=row(t('turnus'), turn+' '+t('people'));
  h+=row(t('holidays')+' '+S.y, S.hol.length);
  h+='</div></div>';
  if(dupN.length||badT.length||noAv.length){
    h+='<div class="card"><h2>'+esc(t('dataHealth'))+'</h2><div class="pad" style="padding-top:0">';
    if(dupN.length) h+='<div class="note bad">'+esc(dupN.join(', '))+'</div>';
    if(badT.length) h+='<div class="note bad">'+esc(t('turnus'))+': '+esc(badT.join(', '))+'</div>';
    if(noAv.length) h+='<div class="note warn">'+esc(t('notAvail'))+': '+esc(noAv.join(', '))+'</div>';
    h+='</div></div>';
  }
  return h;
}

function bajramMissing(y){
  var b=(S.settings.bajram&&S.settings.bajram[y])||H.defaultBajram[y]||{};
  return !b.ramazan && !b.kurban;
}
function holSection(){
  var b=(S.settings.bajram&&S.settings.bajram[S.y])||H.defaultBajram[S.y]||{};
  var h='';
  if(bajramMissing(S.y)) h+='<div class="note bad">'+esc(tpl(t('bajramMissing'),{y:S.y}))+'</div>';
  h+='<div class="card"><h2>'+esc(t('holidays'))+' '+S.y+' — '+esc(t('bajram'))+'</h2><p class="h">'+esc(t('bajramHint'))+'</p><div class="pad" style="padding-top:0">'+
    '<div class="g2"><div><label class="f">'+esc(t('ramazan'))+'</label>'+
    '<input type="date" id="bjR" value="'+esc(b.ramazan||'')+'"></div>'+
    '<div><label class="f">'+esc(t('kurban'))+'</label>'+
    '<input type="date" id="bjK" value="'+esc(b.kurban||'')+'"></div></div>'+
    '<button class="btn pri sm" style="margin-top:10px" data-a="saveBajram">'+esc(t('save'))+'</button></div></div>';

  var groups={all:[],ort:[],isl:[],kat:[]};
  S.hol.forEach(function(x){ (groups[x.scope]||groups.all).push(x); });
  [['all','holAll'],['ort','holOrt'],['isl','holIsl'],['kat','holKat']].forEach(function(g){
    if(!groups[g[0]].length) return;
    h += '<div class="card"><div class="bhdr">'+esc(t(g[1]))+'</div>';
    groups[g[0]].forEach(function(x,i){
      h += '<div style="display:flex;align-items:center;gap:9px;padding:7px 13px;border-bottom:1px solid var(--line)">'+
        '<span class="chip'+(g[0]==='all'?' r':'')+'">'+esc(LB.fmtShort(x.date))+'</span>'+
        '<span style="flex:1;font-size:13px">'+esc(x[S.lang]||x.mk)+'</span>'+
        '<button class="btn sm gh" data-a="delHol" data-date="'+esc(x.date)+'" data-nm="'+esc(x.mk)+'">✕</button></div>';
    });
    h+='</div>';
  });
  h += '<div class="acts"><button class="btn" data-a="addHol">+ '+esc(t('addHol'))+'</button>'+
       '<button class="btn gh" data-a="resetHol">↺</button></div>';
  return h;
}

/* ---------- RAPORTET ---------- */
function loadYearMonths(){
  var ks=[]; for(var m=1;m<=12;m++) ks.push('month:'+LB.mk(S.y,m));
  return Promise.all(ks.map(function(k){ return LB.get(k); }));
}
function viewStats(){
  var days=dayInfo(), tot={}, we={}, ho={};
  S.doctors.forEach(function(d){ tot[d.id]=0; we[d.id]=0; ho[d.id]=0; });
  for(var r=0;r<3;r++) days.forEach(function(day){
    var id=S.month.rows[r][day.date]; if(!id||tot[id]===undefined) return;
    tot[id]++; if(day.weekend) we[id]++; if(day.holAll||day.holRel.length) ho[id]++;
  });
  var max=1; Object.keys(tot).forEach(function(k){ if(tot[k]>max) max=tot[k]; });
  var h='';

  /* --- drejtësia, me shpjegim se çfarë të kontrollohet --- */
  if(S.month.fair){
    h+='<div class="card"><h2>'+esc(t('fairness'))+'</h2><div class="pad" style="padding-top:0">';
    S.month.fair.forEach(function(f){
      var bad=f.devMax>1.2||f.weDev>2.5||f.yearSpread>2.5, warn=f.devMax>0.7||f.weDev>1.5||f.yearSpread>1.5;
      h+='<div style="padding:7px 0;border-bottom:1px solid var(--line)">'+
        '<div style="display:flex;align-items:center;gap:9px">'+
        '<span style="flex:1;font-size:13px"><b style="font-weight:600">'+esc(t('row'+f.row))+'</b>'+
        '<span style="display:block;color:var(--muted);font-size:11.5px">'+
        esc(t('monthCol'))+' '+f.monthMin+'–'+f.monthMax+' · '+esc(t('spread'))+' ±'+f.devMax+
        ' · '+esc(t('weekend'))+' ±'+f.weDev+' · '+esc(t('yearCol'))+' '+f.yearSpread+'</span></span>'+
        '<span class="chip '+(bad?'r':(warn?'a':'t'))+'">'+
        esc(bad?t('fairBad'):(warn?t('fairWarn'):t('fairGood')))+'</span></div>';
      if((bad||warn) && f.detail && f.detail.length){
        var off=f.detail.filter(function(x){ return Math.abs(x.dev)>0.6 || Math.abs(x.weDev)>1.4; }).slice(0,5);
        if(off.length){
          h+='<div style="margin-top:6px;padding:7px 9px;background:var(--surface2);border-radius:9px">'+
             '<div style="font-size:11px;color:var(--muted);margin-bottom:4px">'+esc(t('whatCheck'))+'</div>';
          off.forEach(function(x){
            var bits=[];
            if(Math.abs(x.dev)>0.6) bits.push((x.dev>0?'+':'')+x.dev+' '+t('offTarget')+' ('+x.month+' / '+x.target+')');
            if(Math.abs(x.weDev)>1.4) bits.push((x.weDev>0?'+':'')+x.weDev+' '+t('weOff'));
            h+='<div style="font-size:12px;padding:2px 0"><b style="font-weight:600">'+esc(x.name)+'</b> — '+
               esc(bits.join(' · '))+'</div>';
          });
          h+='</div>';
        }
      }
      h+='</div>';
    });
    h+='</div></div>';
  }

  /* --- raporti mujor i kujdestarive --- */
  h+='<div class="card"><h2>'+esc(t('repMonth'))+' — '+esc(t('months')[S.m-1])+' '+S.y+'</h2>';
  [1,2,3].forEach(function(b2){
    var list=S.doctors.filter(function(d){ return d.block===b2 && d.doesDuty; })
      .sort(function(a2,c2){ return tot[c2.id]-tot[a2.id]; });
    h+='<div class="bhdr">'+esc(t('row'+b2))+'</div>';
    list.forEach(function(d){
      var T0=tot[d.id], W0=we[d.id], wd=T0-W0;
      var ys=(S.yearStats&&S.yearStats[d.id])||{total:0,weekend:0};
      var av=(S.month.avail&&S.month.avail[d.id]);
      h+='<div class="st"><div class="t"><b>'+esc(d.name)+'</b><span>'+T0+' '+esc(t('duties'))+
        (W0?' · '+W0+' '+esc(t('weekend')):'')+(ho[d.id]?' · '+ho[d.id]+' '+esc(t('holiday')):'')+
        ' <span style="color:var(--faint)">('+d.minPerMonth+'–'+d.maxPerMonth+')</span></span></div>'+
        '<div class="bar"><i style="width:'+(wd/max*100)+'%"></i><i class="w" style="width:'+(W0/max*100)+'%"></i></div>'+
        (av===0?'<div style="font-size:11px;color:var(--faint);margin-top:3px">'+esc(t('notAvail'))+'</div>':'')+
        '</div>';
    });
  });
  h+='</div>';

  /* --- raporti vjetor --- */
  h+='<div class="card"><h2>'+esc(t('repYear'))+' '+S.y+'</h2><div class="scrollx">'+
     '<table class="rep"><thead><tr><th>'+esc(t('addDoc'))+'</th><th>'+esc(t('quotaCol'))+'</th>'+
     '<th class="n">'+esc(t('duties'))+'</th><th class="n">'+esc(t('weekend'))+'</th>'+
     '<th class="n">'+esc(t('perDuty'))+'</th><th class="n">A</th></tr></thead><tbody>';
  [1,2,3].forEach(function(b3){
    var list=S.doctors.filter(function(d){ return d.block===b3 && d.doesDuty; })
      .sort(function(a3,c3){ return (((S.yearStats||{})[c3.id]||{}).total||0)-(((S.yearStats||{})[a3.id]||{}).total||0); });
    if(!list.length) return;
    h+='<tr class="tot"><td colspan="6">'+esc(t('row'+b3))+'</td></tr>';
    var sT=0,sW=0;
    list.forEach(function(d){
      var y0=(S.yearStats&&S.yearStats[d.id])||{total:0,weekend:0,amb:0};
      sT+=y0.total; sW+=y0.weekend;
      h+='<tr><td>'+esc(d.name)+'</td><td>'+d.minPerMonth+'–'+d.maxPerMonth+'</td>'+
        '<td class="n">'+y0.total+'</td><td class="n">'+y0.weekend+'</td>'+
        '<td class="n">'+(y0.total?(y0.weekend/y0.total).toFixed(2):'—')+'</td>'+
        '<td class="n">'+(y0.amb||0)+'</td></tr>';
    });
    h+='<tr class="tot"><td>Σ</td><td></td><td class="n">'+sT+'</td><td class="n">'+sW+'</td><td></td><td></td></tr>';
  });
  h+='</tbody></table></div></div>';

  /* --- raporti i ambulantës --- */
  h+='<div class="card"><h2>'+esc(t('repAmb'))+'</h2><div id="ambRep"><div class="empty">…</div></div></div>';
  setTimeout(renderAmbReport, 0);
  return h;
}

function renderAmbReport(){
  var host=document.getElementById('ambRep'); if(!host) return;
  loadYearMonths().then(function(list){
    var rows='', per={};
    list.forEach(function(v,ix){
      if(!v || !(v.amb||[]).length) return;
      var mo=ix+1;
      (v.amb||[]).forEach(function(bk){
        if(!bk.doctorId) return;
        per[bk.doctorId]=(per[bk.doctorId]||0)+1;
        rows+='<tr><td>'+esc(t('months')[mo-1])+'</td><td>'+esc(LB.fmtShort(bk.from))+' – '+
              esc(LB.fmtShort(bk.to))+'</td><td>'+esc(nameOf(bk.doctorId)||'—')+'</td></tr>';
      });
    });
    var h='';
    if(!rows) h='<div class="empty">—</div>';
    else {
      h='<div class="scrollx"><table class="rep"><thead><tr><th>'+esc(t('monthCol'))+'</th><th>'+
        esc(t('pickRange'))+'</th><th>'+esc(t('addDoc'))+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
      var ids=Object.keys(per).sort(function(a,b){ return per[b]-per[a]; });
      h+='<div class="bhdr">'+esc(t('repYear'))+' '+S.y+'</div><div class="scrollx"><table class="rep"><tbody>';
      ids.forEach(function(id){
        h+='<tr><td>'+esc(nameOf(id))+'</td><td class="n">'+per[id]+' '+esc(t('ambBlocks2'))+'</td></tr>';
      });
      h+='</tbody></table></div>';
    }
    host.innerHTML=h;
  }).catch(function(){ host.innerHTML='<div class="empty">—</div>'; });
}

/* ---------- ARKIVI ---------- */
function viewArch(){
  return LB.keys().then(function(ks){
    var mkeys=ks.filter(function(k){ return typeof k==='string'&&k.indexOf('month:')===0; }).sort().reverse();
    return Promise.all(mkeys.map(function(k){ return LB.get(k).then(function(v){ return {k:k,v:v}; }); }));
  }).then(function(list){
    var fin=list.filter(function(x){ return x.v&&x.v.finalized; });
    var drafts=list.filter(function(x){ return x.v&&!x.v.finalized; });
    function row(x){
      var ym=x.k.slice(6).split('-');
      return '<button class="dr" data-a="goMonth" data-y="'+ym[0]+'" data-m="'+(+ym[1])+'">'+
        '<span class="av">'+esc(ym[1])+'</span><span class="nm"><b>'+esc(t('months')[+ym[1]-1])+' '+ym[0]+'</b>'+
        '<span>'+(x.v.finalized?esc(t('finalized'))+' · '+esc((x.v.finalizedAt||'').slice(0,10)):esc(t('draft')))+
        ((x.v.notes||[]).length?' · '+x.v.notes.length+' '+esc(t('notes')).toLowerCase():'')+'</span></span>'+
        '<span class="chip'+(x.v.finalized?' t':' a')+'">'+(x.v.finalized?'✓':'●')+'</span></button>';
    }
    var h='';
    h+='<div class="card"><div class="bhdr">'+esc(t('finalized'))+' · '+fin.length+'</div>'+
       (fin.length?fin.map(row).join(''):'<div class="empty">'+esc(t('archEmpty'))+'</div>')+'</div>';
    if(drafts.length) h+='<div class="card"><div class="bhdr">'+esc(t('draft'))+' · '+drafts.length+'</div>'+drafts.map(row).join('')+'</div>';
    return h;
  });
}

/* ---------- zgjedhja e mjekut për një ditë ---------- */
function sheetPick(r,date){
  var days=dayInfo(), day=days.filter(function(x){return x.date===date;})[0];
  var busy=ambBusyMap(), cur=S.month.rows[r][date];
  var cnt={}; days.forEach(function(dd){ var id=S.month.rows[r][dd.date]; if(id) cnt[id]=(cnt[id]||0)+1; });
  var pool=S.doctors.filter(function(d){ return d.block===(r+1); });
  var b='';
  pool.forEach(function(d){
    var reasons=[];
    if(!d.doesDuty||d.active===false) reasons.push(t('off'));
    if(!E.inTurnus(d,date)) reasons.push(t('reason_turnus'));
    if((d.absences||[]).indexOf(date)>=0) reasons.push(t('reason_abs'));
    if((d.skipWeekdays||[]).indexOf(day.w)>=0) reasons.push(t('reason_wd'));
    if(busy[d.id]&&busy[d.id][date]) reasons.push(t('reason_amb'));
    if(day.weekend&&d.wantsWeekend==='never') reasons.push(t('reason_we'));
    if(day.holAll&&d.wantsStateHoliday==='never') reasons.push(t('reason_hol'));
    if(d.wantsRelHoliday==='never'&&(day.holRel||[]).some(function(x){return x.scope===d.religion;}))
      reasons.push(t('reason_hol'));
    if((cnt[d.id]||0)>=d.maxPerMonth && cur!==d.id) reasons.push(t('reason_max'));
    b += '<button class="pk'+(cur===d.id?' sel':'')+(reasons.length?' no':'')+'" data-a="setDoc" data-r="'+r+'" data-d="'+date+'" data-id="'+d.id+'">'+
      '<span class="nm">'+esc(d.name)+'</span>'+
      '<span class="chip">'+(cnt[d.id]||0)+'/'+d.maxPerMonth+'</span>'+
      (reasons.length?'<span class="chip r">'+esc(reasons[0])+'</span>':'')+'</button>';
  });
  sheet((+date.slice(8))+' '+t('months')[S.m-1]+' · '+t('dows')[day.w], b,
    '<button class="btn" data-a="unsetDoc" data-r="'+r+'" data-d="'+date+'">'+esc(t('remove'))+'</button>'+
    '<button class="btn gh" data-a="closeSheet">'+esc(t('close'))+'</button>');
}

/* ---------- zgjedhja për ambulantë ---------- */
function sheetPickAmb(i){
  var blk=S.month.amb[i];
  var b='';
  S.doctors.filter(function(d){ return d.doesAmb; }).forEach(function(d){
    var bad=[];
    var dt=blk.from;
    while(dt<=blk.to){ if((d.absences||[]).indexOf(dt)>=0){ bad.push(t('reason_abs')); break; } dt=H.addDays(dt,1); }
    b += '<button class="pk'+(blk.doctorId===d.id?' sel':'')+(bad.length?' no':'')+'" data-a="setAmb" data-i="'+i+'" data-id="'+d.id+'">'+
      '<span class="nm">'+esc(d.name)+'</span><span class="chip">'+esc(t('row'+d.block))+'</span>'+
      (bad.length?'<span class="chip r">'+esc(bad[0])+'</span>':'')+'</button>';
  });
  sheet(t('amb')+' · '+LB.fmtShort(blk.from)+' – '+LB.fmtShort(blk.to), b,
    '<button class="btn gh" data-a="closeSheet">'+esc(t('close'))+'</button>');
}

function sheetAbs(id){
  var d=S.byId[id];
  var list=(d.absences||[]).slice().sort(function(a,b){
    var fa=typeof a==='string'?a:a.from, fb=typeof b==='string'?b:b.from; return fa<fb?-1:1; });
  var b='';
  b+='<div class="g2"><div><label class="f">'+esc(t('absFrom'))+'</label><input type="date" id="abF"></div>'+
     '<div><label class="f">'+esc(t('absTo'))+'</label><input type="date" id="abT"></div></div>';
  b+='<label class="f">'+esc(t('absNote'))+'</label><input type="text" id="abN" placeholder="'+esc(t('absNote'))+'">';
  b+='<button class="btn pri sm" style="margin-top:9px" data-a="absAdd" data-id="'+id+'">+ '+esc(t('absAdd'))+'</button>';
  b+='<div style="margin-top:14px">';
  if(!list.length) b+='<div style="color:var(--faint);font-size:13px;padding:8px 0">'+esc(t('absNone'))+'</div>';
  list.forEach(function(a,i){
    var f=typeof a==='string'?a:a.from, to=typeof a==='string'?a:(a.to||a.from), nt=typeof a==='string'?'':(a.note||'');
    var n=0,c=f; while(c<=to){ n++; c=H.addDays(c,1); }
    b+='<div style="display:flex;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)">'+
      '<span class="chip r">'+esc(LB.fmtShort(f))+(f!==to?' – '+esc(LB.fmtShort(to)):'')+'</span>'+
      '<span style="flex:1;font-size:13px">'+esc(nt||'')+'<span style="color:var(--faint)"> · '+n+' '+esc(t('absDays'))+'</span></span>'+
      '<button class="btn sm gh" data-a="absDel" data-id="'+id+'" data-i="'+i+'">✕</button></div>';
  });
  b+='</div>';
  b+='<label class="f" style="margin-top:12px">'+esc(t('quick'))+' — '+esc(t('months')[S.m-1])+' '+S.y+'</label>';
  var nd=E.daysInMonth(S.y,S.m);
  b+='<div class="days" style="padding:6px 0">';
  for(var i2=1;i2<=nd;i2++){ var dt=H.iso(S.y,S.m,i2);
    b+='<button data-absday="'+dt+'" data-id="'+id+'" class="'+(E.isAbsent(d,dt)?'on':'')+(H.dow(dt)>=5?' we':'')+'">'+i2+'</button>'; }
  b+='</div>';
  sheet(d.name, b, '<button class="btn gh" data-a="closeSheet">'+esc(t('close'))+'</button>', true);
}

/* ============ eksporti ============ */
function download(blob,name){
  var a=document.createElement('a'), u=URL.createObjectURL(blob);
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ try{ URL.revokeObjectURL(u); }catch(e){} a.remove(); },1500);
}
function exportDocx(){
  var days=dayInfo();
  var rows=days.map(function(day){
    return {d:day.d, r1:nameOf(S.month.rows[0][day.date]), r2:nameOf(S.month.rows[1][day.date]), r3:nameOf(S.month.rows[2][day.date])};
  });
  var MK=LB.T.mk.months;
  var amb=(S.month.amb||[]).filter(function(b){return b.doctorId;}).map(function(b){
    return LB.fmtShort(b.from)+'-'+LB.fmtShort(b.to)+': '+nameOf(b.doctorId);
  });
  var blob=DOCX.build({
    title: MK[S.m-1]+'  '+S.y+' дежурство',
    days: rows, amb: amb,
    notes: (S.month.notes||[]).map(function(n){return n.text;}),
    director: S.settings.director
  });
  download(blob, 'dezurstva-'+LB.mk(S.y,S.m)+'.docx');
}
function exportJson(){
  return LB.keys().then(function(ks){
    return Promise.all(ks.map(function(k){ return LB.get(k).then(function(v){ return [k,v]; }); }));
  }).then(function(pairs){
    var o={_v:1,_at:new Date().toISOString(),data:{}};
    pairs.forEach(function(p){ o.data[p[0]]=p[1]; });
    var js=JSON.stringify(o);
    download(new Blob([js],{type:'application/json'}),'kujdestari-backup-'+new Date().toISOString().slice(0,10)+'.json');
    S.settings.lastBackup=Date.now(); return saveSettings();
  });
}
function importText(txt){
  return importCore(txt);
}
function importJson(file){
  return file.text().then(importCore);
}
function importCore(txt){
  var n=0, dn=0;
  return Promise.resolve(txt).then(function(txt){
    var o;
    try{ o=JSON.parse(txt); }catch(e){ throw new Error('bad'); }
    if(!o || typeof o!=='object' || !o.data || typeof o.data!=='object') throw new Error('bad');
    if(!Array.isArray(o.data.doctors)) throw new Error('bad');
    var okDocs = o.data.doctors.every(function(d){
      return d && typeof d.id==='string' && typeof d.name==='string'; });
    if(!okDocs) throw new Error('bad');
    // muajt duhet të kenë strukturën e pritur
    var bad=Object.keys(o.data).some(function(k){
      if(k.indexOf('month:')!==0) return false;
      var v=o.data[k];
      return !v || !Array.isArray(v.rows) || v.rows.length!==3;
    });
    if(bad) throw new Error('bad');
    n=Object.keys(o.data).length; dn=o.data.doctors.length;
    // zëvendësim i plotë: çelësat e vjetër fshihen, që të mos mbeten mbetje
    return LB.keys().then(function(ks){
      return Promise.all(ks.map(function(k){ return LB.del(k); }));
    }).then(function(){
      return Promise.all(Object.keys(o.data).map(function(k){ return LB.set(k,o.data[k]); }));
    });
  }).then(function(){ return loadAll(); }).then(function(){
    UND=[]; return LB.set('undo',UND);
  }).then(render).then(function(){
    toast(tpl(t('importOk'),{n:n,d:dn}),'ok');
  }).catch(function(){
    toast(t('importBad'),'bad');
  });
}

/* ---------- kopja automatike në dosje ---------- */
var dirHandle=null;
function touchBackup(){
  if(!dirHandle) return;
  return LB.keys().then(function(ks){
    return Promise.all(ks.map(function(k){ return LB.get(k).then(function(v){ return [k,v]; }); }));
  }).then(function(pairs){
    var o={_v:1,_at:new Date().toISOString(),data:{}};
    pairs.forEach(function(p){ o.data[p[0]]=p[1]; });
    return dirHandle.getFileHandle('kujdestari-backup.json',{create:true});
  }).then(function(fh){ return fh.createWritable(); })
    .then(function(w){ return LB.keys().then(function(ks){
      return Promise.all(ks.map(function(k){ return LB.get(k).then(function(v){ return [k,v]; }); }))
        .then(function(pairs){ var o={_v:1,_at:new Date().toISOString(),data:{}};
          pairs.forEach(function(p){ o.data[p[0]]=p[1]; });
          return w.write(JSON.stringify(o)).then(function(){ return w.close(); }); });
      }); })
    .then(function(){ S.settings.lastBackup=Date.now(); return saveSettings(); })
    .catch(function(){});
}

/* ============ ngjarjet ============ */
document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-a],[data-tab],[data-seg] button,[data-dseg] button,[data-tg],[data-wd],[data-abs],[data-absday],[data-pid]');
  if(!el) return;

  if(el.dataset.tab){ S.tab=el.dataset.tab; render(); return; }

  // segmentet e cilësimeve
  var segp = el.closest('[data-seg]');
  if(segp && !el.dataset.a){
    var nm=segp.dataset.seg, v=el.dataset.v;
    if(nm==='rosterView'){ S.rosterView=v; S.settings.rosterView=v; saveSettings().then(render); return; }
    if(nm==='absView'){ S.absView=v; render(); return; }
    if(nm==='docsView'){ S.docsView=v; render(); return; }
    if(nm==='lang'){ S.lang=v; S.settings.lang=v; saveSettings().then(render); }
    if(nm==='theme'){ S.theme=v; S.settings.theme=v; saveSettings().then(render); }
    return;
  }
  // segmentet e profilit
  var dsp = el.closest('[data-dseg]');
  if(dsp && !el.dataset.a){
    var k=dsp.dataset.dseg, val=el.dataset.v;
    if(k==='block') val=+val;
    window.__editDoc[k]=val;
    Array.prototype.forEach.call(dsp.children,function(c){ c.classList.toggle('on', c===el); });
    return;
  }
  if(el.dataset.tg!==undefined && el.dataset.tg){
    var key=el.dataset.tg;
    var on=!el.classList.contains('on');
    el.classList.toggle('on',on);
    window.__editDoc[key] = on;
    return;
  }
  if(el.dataset.wd!==undefined && el.dataset.wd!==''){
    var w=+el.dataset.wd, arr=window.__editDoc.skipWeekdays||[];
    var ix=arr.indexOf(w); if(ix>=0) arr.splice(ix,1); else arr.push(w);
    window.__editDoc.skipWeekdays=arr; el.classList.toggle('on'); return;
  }
  if(el.dataset.pid){
    var cpBox=el.closest('[data-cp]');
    if(cpBox){
      var grp=cpBox.dataset.cp;
      var arr=window.__editDoc[grp]||[];
      var ixp=arr.indexOf(el.dataset.pid);
      if(ixp>=0) arr.splice(ixp,1); else arr.push(el.dataset.pid);
      window.__editDoc[grp]=arr; el.classList.toggle('on');
    }
    return;
  }
  if(el.dataset.absday){
    var qd=el.dataset.absday, qdoc=S.byId[el.dataset.id];
    qdoc.absences=qdoc.absences||[];
    if(E.isAbsent(qdoc,qd)){
      var out=[];
      qdoc.absences.forEach(function(x){
        var f=typeof x==='string'?x:x.from, to=typeof x==='string'?x:(x.to||x.from), nt=typeof x==='string'?'':(x.note||'');
        if(qd<f||qd>to){ out.push(x); return; }
        var at0=(typeof x==='string')?Date.now():(x.at||Date.now());
        if(f<qd) out.push({from:f,to:H.addDays(qd,-1),note:nt,at:at0});
        if(to>qd) out.push({from:H.addDays(qd,1),to:to,note:nt,at:at0});
      });
      qdoc.absences=out;
    } else {
      qdoc.absences.push({from:qd,to:qd,note:'',at:Date.now()});
    }
    saveDoctors().then(function(){ sheetAbs(qdoc.id); render(); });
    return;
  }

  var a=el.dataset.a;
  if(!a) return;

  if(a==='closeSheet'){ closeSheet(); return; }
  if(a==='pick'){ if(S.month.finalized) return; sheetPick(+el.dataset.r, el.dataset.d); return; }
  if(a==='setDoc'){
    var r=+el.dataset.r, d=el.dataset.d;
    snapshot(t('actPick')).then(function(){
      logChange('chPick',{date:d,row:r+1,a:nameOf(S.month.rows[r][d])||'—',b:nameOf(el.dataset.id)});
      S.month.rows[r][d]=el.dataset.id;
      S.month.locked[r][d]=true;
      return saveMonth();
    }).then(function(){ closeSheet(); render(); }); return;
  }
  if(a==='unsetDoc'){
    var r2=+el.dataset.r, d2=el.dataset.d;
    delete S.month.rows[r2][d2]; delete S.month.locked[r2][d2];
    saveMonth().then(function(){ closeSheet(); render(); }); return;
  }
  if(a==='ambAdd'){ sheetAmbBlock(-1); return; }
  if(a==='ambEdit'){ sheetAmbBlock(+el.dataset.i); return; }
  if(a==='abkPick'){
    window.__ambEdit.doctorId=el.dataset.id||'';
    Array.prototype.forEach.call(el.parentNode.children,function(c){ c.classList.toggle('on', c===el); });
    var f=$('#abkF').value, to=$('#abkT').value;
    var wbox=$('#abkWarn'); wbox.innerHTML='';
    if(el.dataset.id && f && to){
      var n=ambDutyCount(el.dataset.id,f,to);
      if(n) wbox.innerHTML='<div class="note warn">'+esc(tpl(t('ambHasDuty'),{name:nameOf(el.dataset.id),n:n}))+'</div>';
    }
    return;
  }
  if(a==='abkSave'){
    var ae=window.__ambEdit, f2=$('#abkF').value, t2=$('#abkT').value;
    if(!f2||!t2) return;
    if(t2<f2){ var sw2=f2; f2=t2; t2=sw2; }
    var m0=H.iso(S.y,S.m,1), m1=H.iso(S.y,S.m,E.daysInMonth(S.y,S.m));
    if(f2<m0||t2>m1){ toast(t('ambOutside'),'bad'); return; }
    if(ambOverlaps(f2,t2,ae.ix)){ toast(t('ambOverlap'),'bad'); return; }
    snapshot(t('actAmb')).then(function(){
      S.month.amb=S.month.amb||[];
      var days=[], c=f2; while(c<=t2){ days.push(c); c=H.addDays(c,1); }
      var blk={from:f2,to:t2,days:days,doctorId:ae.doctorId||''};
      if(ae.ix<0){ S.month.amb.push(blk); logChange('chAmbAdd',{from:f2,to:t2}); }
      else { S.month.amb[ae.ix]=blk; logChange('chAmbSet',{from:f2,to:t2,a:nameOf(ae.doctorId)||t('none')}); }
      S.month.amb.sort(function(x,y4){ return x.from<y4.from?-1:1; });
      S.month.lockedAmb=S.month.lockedAmb||{};
      if(ae.doctorId) S.month.lockedAmb[f2]=ae.doctorId;
      return saveMonth();
    }).then(function(){ closeSheet(); render(); toast(t('save'),'ok'); });
    return;
  }
  if(a==='abkDel'){
    var di=+el.dataset.i, bd=S.month.amb[di];
    snapshot(t('actAmb')).then(function(){
      if(bd){ delete (S.month.lockedAmb||{})[bd.from]; logChange('chAmbDel',{from:bd.from,to:bd.to}); }
      S.month.amb.splice(di,1);
      return saveMonth();
    }).then(function(){ closeSheet(); render(); });
    return;
  }
  if(a==='draftSave'){
    var nm2=prompt(t('draftName'), t('drafts')+' '+((S.month.drafts||[]).length+1));
    if(nm2===null) return;
    saveDraft(nm2||undefined).then(render).then(function(){ toast(t('draftSaved'),'ok'); });
    return;
  }
  if(a==='draftRestore'){ restoreDraft(el.dataset.id); return; }
  if(a==='draftDel'){
    S.month.drafts=(S.month.drafts||[]).filter(function(x){ return x.id!==el.dataset.id; });
    saveMonth().then(render); return;
  }
  if(a==='clearLog'){
    S.month.log=[]; saveMonth().then(render); return;
  }
  if(a==='pickAmb'){ sheetPickAmb(+el.dataset.i); return; }
  if(a==='setAmb'){
    var i=+el.dataset.i;
    S.month.amb[i].doctorId=el.dataset.id;
    S.month.lockedAmb[S.month.amb[i].from]=el.dataset.id;
    saveMonth().then(function(){ closeSheet(); render(); }); return;
  }
  if(a==='rules'){
    var st=S.settings;
    var b='<label class="f">'+esc(t('minGap'))+'</label><div class="g3">'+
      [0,1,2].map(function(i){ return '<div><span style="font-size:10.5px;color:var(--faint)">'+esc(t('row'+(i+1)))+'</span>'+
        '<input type="number" min="1" max="15" id="rGap'+i+'" value="'+st.minGap[i]+'"></div>'; }).join('')+'</div>'+
      '<label class="f">'+esc(t('maxWe'))+'</label><div class="g3">'+
      [0,1,2].map(function(i){ return '<div><span style="font-size:10.5px;color:var(--faint)">'+esc(t('row'+(i+1)))+'</span>'+
        '<input type="number" min="1" max="5" id="rWe'+i+'" value="'+st.maxWeekend[i]+'"></div>'; }).join('')+'</div>'+
      '<label class="f">'+esc(t('ambBlocks'))+'</label><input type="number" min="1" max="4" id="rAmb" value="'+st.ambBlocks+'">'+
      '<label class="f">'+esc(t('restarts'))+'</label><input type="number" min="50" max="3000" step="50" id="rQ" value="'+st.quality+'">';
    sheet(t('rules'), b,
      '<button class="btn pri" data-a="rulesSave">'+esc(t('save'))+'</button>'+
      '<button class="btn" data-a="rulesGen">'+esc(t('gen'))+'</button>'+
      '<button class="btn gh" data-a="closeSheet">'+esc(t('cancel'))+'</button>', true);
    return;
  }
  if(a==='rulesSave'||a==='rulesGen'){
    S.settings.minGap=[0,1,2].map(function(i){ return +$('#rGap'+i).value||4; });
    S.settings.maxWeekend=[0,1,2].map(function(i){ return +$('#rWe'+i).value||1; });
    S.settings.ambBlocks=+$('#rAmb').value||2;
    S.settings.quality=+$('#rQ').value||400;
    var again=(a==='rulesGen');
    saveSettings().then(function(){ closeSheet();
      if(again) return doGenerateAmb().then(doGenerateDuty);
    }).then(render);
    return;
  }
  if(a==='menu'){
    var b='<button class="pk" data-a="genAll"><span class="nm">'+esc(t('gen'))+'</span></button>'+
          '<button class="pk" data-a="genAmb"><span class="nm">'+esc(t('genAmb'))+'</span></button>'+
          '<button class="pk" data-a="update"><span class="nm">'+esc(t('update'))+'</span></button>'+
          '<button class="pk" data-a="rules"><span class="nm">'+esc(t('rules'))+'</span></button>'+
          '<button class="pk" data-a="final"><span class="nm">'+esc(t('finalize'))+'</span></button>'+
          '<button class="pk" data-a="clear"><span class="nm" style="color:var(--rose)">'+esc(t('clear'))+'</span></button>';
    sheet(t('actions'), b, '<button class="btn gh" data-a="closeSheet">'+esc(t('close'))+'</button>');
    return;
  }
  if(a==='update'){ closeSheet(); doUpdate(); return; }
  if(a==='genAmb'){ closeSheet();
    snapshot(t('actAmb')).then(doGenerateAmb).then(render)
      .then(function(){ toast(t('genAmb'),'ok'); }); return; }
  if(a==='genAll'){ closeSheet(); sheetGenerate(); return; }
  if(a==='goAbs'){ closeSheet(); S.tab='abs'; render(); return; }
  if(a==='gRow'){ var ri2=+el.dataset.r; GEN.rows[ri2]=!GEN.rows[ri2]; sheetGenerate(); return; }
  if(a==='gEmpty'){ GEN.onlyEmpty=!GEN.onlyEmpty; sheetGenerate(); return; }
  if(a==='gAmb'){ GEN.amb=!GEN.amb; sheetGenerate(); return; }
  if(a==='gMode'){ GEN.mode=el.dataset.v; sheetGenerate(); return; }
  if(a==='gVariants'){ sheetVariants(); return; }
  if(a==='useVariant'){
    var vi=+el.dataset.i, v=GEN.variants&&GEN.variants[vi];
    if(!v) return;
    closeSheet();
    snapshot(t('actGen')).then(function(){ return applyResult(v.res); })
      .then(render).then(function(){ toast(t('gen'),'ok'); });
    return;
  }
  if(a==='gRun'){
    if(!GEN.rows[0]&&!GEN.rows[1]&&!GEN.rows[2]&&!GEN.amb) return;
    closeSheet(); toast(t('generating'));
    snapshot(t('actGen')).then(function(){
      return GEN.amb ? doGenerateAmb() : Promise.resolve();
    }).then(function(){
      if(!GEN.rows[0]&&!GEN.rows[1]&&!GEN.rows[2]) return;
      return runGeneration(Date.now()&0xffff).then(applyResult);
    }).then(render).then(function(){ toast(t('gen'),'ok'); });
    return;
  }
  if(a==='clear'){
    closeSheet();
    confirmBox({title:t('cClearTitle'), msg:t('cClearMsg'), danger:true,
      yes:t('yes'), no:t('no')}).then(function(ok){
      if(!ok) return;
      snapshot(t('actClear')).then(function(){
        var oldLog=S.month.log||[];
        S.month=blankMonth(); S.month.log=oldLog;
        logChange('chClear',{});
        return saveMonth(); }).then(render)
        .then(function(){ toast(t('clear'),'ok'); });
    });
    return;
  }
  if(a==='final'){
    closeSheet();
    confirmBox({title:t('cFinalTitle'), msg:t('cFinalMsg'), yes:t('yes'), no:t('no')}).then(function(ok){
      if(!ok) return;
      snapshot(t('actFinal')).then(function(){
        S.month.finalized=true; S.month.finalizedAt=new Date().toISOString();
        S.month.drafts=[];
        logChange('chFinal',{});
        return saveMonth(); }).then(render).then(function(){ toast(t('finalized'),'ok'); });
    });
    return;
  }
  if(a==='docx'){ exportDocx(); return; }
  if(a==='addNote'){
    var txt=prompt(t('addNote')); if(!txt) return;
    S.month.notes.push({text:txt,at:new Date().toISOString()});
    saveMonth().then(render); return;
  }
  if(a==='delNote'){
    S.month.notes.splice(+el.dataset.i,1); saveMonth().then(render); return;
  }
  if(a==='wdPref'){
    var dw=S.byId[el.dataset.id]; if(!dw) return;
    var wv=+el.dataset.w, arr=dw.skipWeekdays||[];
    var ixw=arr.indexOf(wv);
    if(ixw>=0) arr.splice(ixw,1); else arr.push(wv);
    dw.skipWeekdays=arr;
    el.classList.toggle('off');
    snapshot(t('actPref'), true).then(saveDoctors); return;
  }
  if(a==='triPref'){
    var dt2=S.byId[el.dataset.id]; if(!dt2) return;
    var f=el.dataset.f, cur=dt2[f]||'ok';
    var nx = cur==='ok'?'avoid':(cur==='avoid'?'never':'ok');
    dt2[f]=nx;
    el.classList.remove('avoid','never');
    if(nx!=='ok') el.classList.add(nx);
    snapshot(t('actPref'), true).then(saveDoctors); return;
  }
  if(a==='clearPref'){
    var dc=S.byId[el.dataset.id]; if(!dc) return;
    dc.skipWeekdays=[]; dc.wantsWeekend='ok'; dc.wantsStateHoliday='ok'; dc.wantsRelHoliday='ok';
    saveDoctors().then(render); return;
  }
  if(a==='applyFix'){
    snapshot(t('actFix'), true);
    logChange('chFix',{});
    var fx=JSON.parse(el.dataset.fix||'{}');
    var p2=null;
    if(fx.act==='raiseMax'){
      (fx.ids||[]).forEach(function(id){ var d2=S.byId[id]; if(d2) d2.maxPerMonth=Math.min(6,d2.maxPerMonth+1); });
      p2=saveDoctors();
    } else if(fx.act==='lowerGap'){
      S.settings.minGap[fx.row-1]=fx.v; p2=saveSettings();
    } else if(fx.act==='raiseQuota'||fx.act==='lowerQuota'){
      var d3=S.byId[fx.id];
      if(d3){ d3.minPerMonth=Math.max(0,fx.min); d3.maxPerMonth=Math.max(d3.minPerMonth,fx.max); }
      p2=saveDoctors();
    } else if(fx.act==='avoidWeekend'){
      var d4=S.byId[fx.id]; if(d4) d4.wantsWeekend='avoid'; p2=saveDoctors();
    }
    (p2||Promise.resolve()).then(render).then(function(){ toast(t('applied'),'ok'); });
    return;
  }
  if(a==='ambUp'||a==='ambDown'){
    var ambH={}; Object.keys(S.hist||{}).forEach(function(id){
      ambH[id]={count:(S.hist[id].amb||0), last:(S.hist[id].lastAmb||'')}; });
    var Q=AN.ambQueue({doctors:S.doctors, ambHistory:ambH});
    var i0=+el.dataset.i, j0=(a==='ambUp')?i0-1:i0+1;
    if(j0<0||j0>=Q.length) return;
    var tmp=Q[i0]; Q[i0]=Q[j0]; Q[j0]=tmp;
    Q.forEach(function(x,ix){ x.doc.ambOrder=ix; });
    saveDoctors().then(render); return;
  }
  if(a==='ambAuto'){
    S.doctors.forEach(function(d){ delete d.ambOrder; });
    saveDoctors().then(render).then(function(){ toast(t('autoOrder'),'ok'); }); return;
  }
  if(a==='editAbs'){ sheetAbs(el.dataset.id); return; }
  if(a==='absAdd'){
    var idA=el.dataset.id, dA=S.byId[idA];
    var f=$('#abF').value, to=$('#abT').value||f;
    if(!f) return;
    if(to<f){ var sw=f; f=to; to=sw; }
    dA.absences=dA.absences||[];
    dA.absences.push({from:f,to:to,note:$('#abN').value.trim(),at:Date.now()});
    saveDoctors().then(function(){ sheetAbs(idA); render(); }); return;
  }
  if(a==='absDel'){
    var idD=el.dataset.id, dD=S.byId[idD];
    var srt=(dD.absences||[]).slice().sort(function(x,y3){
      var fx=typeof x==='string'?x:x.from, fy=typeof y3==='string'?y3:y3.from; return fx<fy?-1:1; });
    var rm=srt[+el.dataset.i];
    dD.absences=(dD.absences||[]).filter(function(x){ return x!==rm; });
    saveDoctors().then(function(){ sheetAbs(idD); render(); }); return;
  }
  if(a==='addDoc'){ sheetDoc(null); return; }
  if(a==='editDoc'){ sheetDoc(el.dataset.id); return; }
  if(a==='saveDoc'){
    var d0=window.__editDoc;
    d0.name = $('#dcName').value.trim();
    if(!d0.name) return;
    d0.specialty=$('#dcSp').value.trim();
    d0.email=$('#dcMail').value.trim(); d0.phone=$('#dcTel').value.trim();
    d0.title=$('#dcTitle').value.trim(); d0.institution=$('#dcInst').value.trim();
    d0.mentor=$('#dcMentor').value.trim();
    d0.minPerMonth=+$('#dcMin').value||0;
    d0.maxPerMonth=+$('#dcMax').value||0;
    d0.turnusFrom=$('#dcTF').value; d0.turnusTo=$('#dcTT').value;
    d0.note=$('#dcNote').value;
    if(+el.dataset.new){ S.doctors.push(d0); }
    else { var ix=S.doctors.findIndex(function(x){return x.id===d0.id;}); if(ix>=0) S.doctors[ix]=d0; }
    saveDoctors().then(function(){ S.byId={}; S.doctors.forEach(function(x){S.byId[x.id]=x;}); closeSheet(); render(); });
    return;
  }
  if(a==='delDoc'){
    var did=el.dataset.id, dn=(S.byId[did]||{}).name||'';
    confirmBox({title:tpl(t('cDelDocTitle'),{name:dn}), msg:t('cDelDocMsg'), danger:true,
      yes:t('yes'), no:t('no')}).then(function(ok){
      if(!ok) return;
      S.doctors=S.doctors.filter(function(x){ return x.id!==did; });
      saveDoctors().then(function(){ closeSheet(); render(); toast(dn,'ok'); });
    });
    return;
  }
  if(a==='goMonth'){ S.y=+el.dataset.y; S.m=+el.dataset.m; S.tab='roster'; loadMonth().then(render); return; }
  if(a==='saveSet'){
    S.settings.director=$('#stDir').value; saveSettings().then(render); return;
  }
  if(a==='saveRules'){
    S.settings.minGap=[0,1,2].map(function(i){ return +$('#gap'+i).value||4; });
    S.settings.maxWeekend=[0,1,2].map(function(i){ return +$('#we'+i).value||1; });
    S.settings.ambBlocks=+$('#ambN').value||2;
    S.settings.quality=+$('#qual').value||400;
    saveSettings().then(render); return;
  }
  if(a==='saveBajram'){
    var y=S.y; S.settings.bajram=S.settings.bajram||{};
    S.settings.bajram[y]={ramazan:$('#bjR').value,kurban:$('#bjK').value};
    saveSettings().then(function(){ return LB.del('hol:'+y); }).then(function(){ return loadHolidays(y); }).then(render);
    return;
  }
  if(a==='resetHol'){ LB.del('hol:'+S.y).then(function(){ return loadHolidays(S.y); }).then(render); return; }
  if(a==='delHol'){
    S.hol=S.hol.filter(function(x){ return !(x.date===el.dataset.date && x.mk===el.dataset.nm); });
    LB.set('hol:'+S.y,S.hol).then(render); return;
  }
  if(a==='addHol'){
    var dt2=prompt('YYYY-MM-DD'); if(!dt2) return;
    var nm2=prompt('Име / Emri'); if(!nm2) return;
    S.hol.push({date:dt2,sq:nm2,mk:nm2,scope:'all'});
    S.hol.sort(function(x,y2){ return x.date<y2.date?-1:1; });
    LB.set('hol:'+S.y,S.hol).then(render); return;
  }
  if(a==='dbxConnect'){
    var k=$('#dbxKey').value.trim();
    if(!k){ toast(t('dbxNoKey'),'bad'); return; }
    DBXS.key=k; DBX.configure(k, DBXS.tok);
    dbxSave().then(function(){ toast(t('dbxLinking')); return DBX.beginLink(); })
      .catch(function(){ toast(t('dbxErr'),'bad'); });
    return;
  }
  if(a==='dbxUnlink'){
    DBXS.tok=null; DBXS.fp='';
    DBX.configure(DBXS.key, null);
    dbxSave().then(render); return;
  }
  if(a==='dbxAuto'){
    DBXS.auto=!DBXS.auto; el.classList.toggle('on', DBXS.auto);
    dbxSave(); return;
  }
  if(a==='dbxUpload'){ toast(t('dbxSaving')); dbxUpload(false).then(render); return; }
  if(a==='dbxRestoreList'){ dbxRestoreSheet(); return; }
  if(a==='dbxPick'){ dbxRestore(el.dataset.p, el.dataset.n); return; }
  if(a==='expJson'){ exportJson().then(render); return; }
  if(a==='impJson'){ $('#fileIn').click(); return; }
  if(a==='pickDir'){
    window.showDirectoryPicker({mode:'readwrite'}).then(function(h){ dirHandle=h; return touchBackup(); }).then(render).catch(function(){});
    return;
  }
  if(a==='reseed'){
    confirmBox({title:t('cReseedTitle'), msg:t('cReseedMsg'), danger:true, yes:t('yes'), no:t('no')})
      .then(function(ok){ if(!ok) return;
        S.doctors=window.LB_SEED.doctors.slice();
        saveDoctors().then(function(){ return loadMonth(); }).then(render)
          .then(function(){ toast(t('seedBtn'),'ok'); }); });
    return;
  }
  if(a==='wipe'){
    confirmBox({title:t('cWipeTitle'), msg:t('cWipeMsg'), danger:true, yes:t('yes'), no:t('no')})
      .then(function(ok){ if(!ok) return;
        LB.keys().then(function(ks){ return Promise.all(ks.map(LB.del)); })
          .then(function(){ S.doctors=[]; return loadAll(); }).then(render); });
    return;
  }
});

document.addEventListener('change', function(ev){
  if(ev.target.id==='fileIn' && ev.target.files[0]){
    var f=ev.target.files[0];
    confirmBox({title:t('cImportTitle'), msg:t('cImportMsg'), danger:true, yes:t('yes'), no:t('no')})
      .then(function(ok){ if(ok) importJson(f).then(function(){ toast(t('importJson'),'ok'); }); });
  }
});

$('#scrim').onclick=closeSheet;
$('#shClose').onclick=closeSheet;
$('#btnUndo').onclick=function(){ doUndo(); };
$('#btnLang').onclick=function(){ S.lang = S.lang==='sq'?'mk':'sq'; S.settings.lang=S.lang; saveSettings().then(render); };
$('#btnTheme').onclick=function(){
  S.theme = S.theme==='auto'?'light':(S.theme==='light'?'dark':'auto');
  S.settings.theme=S.theme; saveSettings().then(render);
};
$('#btnPrev').onclick=function(){ S.m--; if(S.m<1){S.m=12;S.y--;} loadMonth().then(render); };
$('#btnNext').onclick=function(){ S.m++; if(S.m>12){S.m=1;S.y++;} loadMonth().then(render); };

/* gjerësia: tabelë ose listë */
function layout(){
  var wide=window.innerWidth>=760;
  var tb=document.getElementById('tblWide'), ls=document.getElementById('lstNarrow');
  if(tb) tb.style.display = wide?'table':'none';
  if(ls) ls.style.display = wide?'none':'block';
}
window.__setView=function(v){ S.rosterView=v; S.settings.rosterView=v; saveSettings().then(render); };
window.addEventListener('resize',layout);
var _r=render; render=function(){ _r(); layout(); };

/* diagnostikë */
window.__lbDebug=function(){ return {doctors:S.doctors.length, byBlock:[1,2,3].map(function(b){
  return S.doctors.filter(function(d){return d.block===b;}).length; }),
  seed: !!window.LB_SEED && window.LB_SEED.doctors.length,
  hol:S.hol.length, month:LB.mk(S.y,S.m),
  filled:[0,1,2].map(function(r){ return Object.keys(S.month.rows[r]||{}).length; }),
  amb:(S.month.amb||[]).map(function(b){return b.from+'→'+(b.doctorId||'—');}),
  issues:(S.month.issues||[]).length, lang:S.lang, tab:S.tab }; };

/* nisja */
loadAll().then(render).catch(function(e){
  document.getElementById('view').innerHTML='<div class="note bad">'+esc(String(e))+'</div>';
});

if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
})();
</script>
</body></html>
